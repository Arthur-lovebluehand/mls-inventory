<script>
// ════════════════════════════════════════
//  進貨退回 + 整筆刪除 + 操作記錄
// ════════════════════════════════════════

// ── 進貨退回 ──
async function returnPO(no) {
  const [{ data: po }, { data: its }] = await Promise.all([
    sb.from('purchase_orders').select('*').eq('po_no', no).single(),
    sb.from('purchase_order_items').select('*').eq('po_no', no),
  ]);
  const td = today();
  const rows = (its || []).map(i => {
    const recvd = i.received_qty || 0;
    return '<tr>'
      + '<td style="font-size:12px">' + (i.product_name || '—') + '</td>'
      + '<td class="num">' + fN(i.qty) + '</td>'
      + '<td class="num ok">' + fN(recvd) + '</td>'
      + '<td><input type="number" id="f-ret-' + i.id + '" value="0" min="0" max="' + recvd + '"'
      + (recvd <= 0 ? ' disabled' : '')
      + ' style="width:65px;padding:4px 6px;border:1px solid var(--bd);border-radius:var(--r);font-size:13px;outline:none'
      + (recvd <= 0 ? ';opacity:.4' : '') + '"></td>'
      + '</tr>';
  }).join('');
  const itsJson = JSON.stringify(its);
  OM('進貨退回：' + no,
    '<div class="al al-w" style="font-size:12px">退回的數量會從庫存中扣除，並建立退貨記錄。</div>'
    + '<div class="fl" style="margin-bottom:12px"><label>退貨原因 *</label>'
    + '<textarea id="f-preason" rows="2" placeholder="例：品質問題、數量有誤、收到錯誤商品…" style="width:100%;padding:7px 8px;border:1px solid var(--bd);border-radius:var(--r);font-size:13px;outline:none"></textarea></div>'
    + '<div class="fl" style="margin-bottom:12px"><label>退貨日期</label>'
    + '<input id="f-prdate" type="date" value="' + td + '" style="width:160px;padding:7px 8px;border:1px solid var(--bd);border-radius:var(--r);font-size:13px;outline:none"></div>'
    + '<table class="itb"><tr><th>商品</th><th>進貨數</th><th>已收</th><th>退回數量</th></tr>'
    + rows + '</table>',
    '<button class="btn" onclick="CM()">取消</button>'
    + '<button class="btn btn-r" onclick="doReturnPO(\'' + no + '\',' + itsJson + ')">確認退貨</button>'
  );
  window._retPONo = no;
  window._retPOIts = its;
}

async function doReturnPO(no, its) {
  no = no || window._retPONo;
  its = its || window._retPOIts;
  const reason = $('f-preason')?.value?.trim();
  if (!reason) { toast('請填寫退貨原因', 'e'); return; }
  const rdate = $('f-prdate')?.value || today();

  const retItems = [];
  for (const i of (its || [])) {
    const qty = parseFloat($('f-ret-' + i.id)?.value) || 0;
    if (qty > 0) retItems.push({ ...i, retQty: qty });
  }
  if (!retItems.length) { toast('請至少填入一項退回數量', 'e'); return; }

  // 產生退貨單號
  const rno = await genNo('PR', 'purchase_returns', 'return_no');
  const total = retItems.reduce((s, i) => s + (i.unit_price || 0) * i.retQty, 0);

  // 寫入退貨主檔
  const { data: po } = await sb.from('purchase_orders').select('vendor_name').eq('po_no', no).single();
  await sb.from('purchase_returns').insert({
    return_no: rno, po_no: no, return_date: rdate,
    vendor_name: po?.vendor_name, reason, total
  });

  // 寫入退貨明細
  await sb.from('purchase_return_items').insert(retItems.map(i => ({
    return_no: rno, product_no: i.product_no, product_name: i.product_name,
    spec: i.spec, qty: i.retQty, unit_price: i.unit_price || 0,
    amount: (i.unit_price || 0) * i.retQty
  })));

  // 扣回庫存
  for (const i of retItems) {
    const { data: p } = await sb.from('products').select('stock').eq('product_no', i.product_no).single();
    if (p) await sb.from('products').update({ stock: Math.max(0, p.stock - i.retQty) }).eq('product_no', i.product_no);
  }

  // 記錄日誌
  await logAction('return', 'purchase_orders', no,
    `進貨退回 ${no} → ${rno}，原因：${reason}，退回 ${retItems.length} 項，金額 ${fM(total)}`,
    null, { return_no: rno, items: retItems }
  );

  toast(`退貨記錄 ${rno} 已建立，庫存已扣除`);
  CM();
  purchase();
}

// ── 整筆刪除進貨單 ──
async function deletePO(no) {
  const { data: its } = await sb.from('purchase_order_items').select('*').eq('po_no', no);
  const { data: po } = await sb.from('purchase_orders').select('*').eq('po_no', no).single();

  const hasReceived = (its || []).some(i => (i.received_qty || 0) > 0);
  const confirmMsg = `確定刪除整筆進貨單 ${no}？\n\n`
    + (hasReceived ? '⚠ 此單已有收貨記錄，庫存將自動扣回！\n\n' : '')
    + '此操作無法復原，操作記錄將被保留。';

  if (!confirm(confirmMsg)) return;

  // 若已有收貨，逆轉庫存
  if (hasReceived) {
    for (const i of (its || [])) {
      const recvd = i.received_qty || 0;
      if (recvd > 0) {
        const { data: p } = await sb.from('products').select('stock').eq('product_no', i.product_no).single();
        if (p) await sb.from('products').update({ stock: Math.max(0, p.stock - recvd) }).eq('product_no', i.product_no);
      }
    }
  }

  await sb.from('purchase_order_items').delete().eq('po_no', no);
  await sb.from('purchase_orders').delete().eq('po_no', no);

  await logAction('delete', 'purchase_orders', no,
    '刪除整筆進貨單 ' + no + (hasReceived ? '（含庫存逆轉）' : ''),
    { po, items: its }
  );

  toast('進貨單已刪除' + (hasReceived ? '，庫存已逆轉' : '') + '，操作已記錄');
  purchase();
}

// ── 操作記錄查看頁面 ──
let alP = 1;

  const { data, count } = await sb.from('audit_logs')

  const actionColor = { create: 'bg', update: 'bb', delete: 'br2', return: 'ba', adjust: 'bbr' };
  const actionLabel = { create: '新增', update: '修改', delete: '刪除', return: '退回', adjust: '調整' };

  $('main').innerHTML = `
  <div class="ph"><div><div class="pt">操作記錄</div><div class="ps">共 ${count || 0} 筆</div></div>
    <div class="ha">
      <div class="fl" style="display:flex;gap:6px;align-items:center">
        <label style="font-size:12px;color:var(--tx2)">操作者名稱：</label>
        <input id="op-name" value="${localStorage.getItem('mls_operator') || ''}" placeholder="輸入你的名字"
          style="padding:5px 8px;border:1px solid var(--bd);border-radius:var(--r);font-size:12px;outline:none;width:100px">
        <button class="btn btn-s" onclick="saveOpName()">儲存</button>
      </div>
    </div></div>
  <div class="pc">
    <div class="al al-w" style="font-size:12px">
      所有新增、修改、刪除、退貨、庫存調整操作都記錄在這裡。設定操作者名稱後，每筆記錄都會帶入你的名字，方便多人操作時追蹤。
    </div>
    <div class="tc">
      <div class="tb"><span class="tt">操作日誌</span></div>
      <div class="tw"><table>
        <tr><th>時間</th><th>操作類型</th><th>資料表</th><th>記錄號</th><th>說明</th><th>操作者</th><th>裝置</th></tr>
        ${(data || []).map(l => `<tr>
          <td style="font-size:11px;white-space:nowrap;color:var(--tx2)">${new Date(l.created_at).toLocaleString('zh-TW')}</td>
          <td><span class="badge ${actionColor[l.action] || 'bgr'}">${actionLabel[l.action] || l.action}</span></td>
          <td style="font-size:11px;color:var(--tx2)">${l.table_name}</td>
          <td style="font-size:11px;font-family:monospace">${l.record_id || '—'}</td>
          <td style="font-size:12px;max-width:280px">${l.description || '—'}</td>
          <td style="font-size:12px">${l.operator || '—'}</td>
          <td style="font-size:10px;color:var(--tx3)">${l.device_id || '—'}</td>
        </tr>`).join('')}
      </table></div>
      <div class="pg"><span class="pi">第 ${alP}/${tp} 頁，共 ${count} 筆</span>
        <div style="display:flex;gap:5px">
          ${alP > 1 ? `<button class="btn btn-s" onclick="alP--;auditLogs()">上一頁</button>` : ''}
          ${alP < tp ? `<button class="btn btn-s" onclick="alP++;auditLogs()">下一頁</button>` : ''}
        </div></div>

function saveOpName() {
  const name = $('op-name')?.value?.trim();
  if (name) { localStorage.setItem('mls_operator', name); toast('操作者名稱已儲存：' + name); }
}

window.returnPO = returnPO;
window.doReturnPO = doReturnPO;
window.deletePO = deletePO;

    <div class="dr"><span class="dlb">發放/收款日期</span><span class="dv">${fD(b.payment_date)}</span></div>
    <div class="dr"><span class="dlb">狀態</span><span class="dv"><span class="badge ${b.payment_done?'bg':'br2'}">${b.payment_done?'已完成':'待處理'}</span></span></div>
    ${b.note?`<div class="dr" style="grid-column:1/-1"><span class="dlb">備註</span><span class="dv" style="white-space:pre-wrap">${b.note}</span></div>`:''}
  </div>`,
  `<button class="btn" onclick="CM()">關閉</button>
   <button class="btn" onclick="editBonus('${no}')">編輯</button>`
  );
}

async function editBonus(no){
  const{data:b}=await sb.from('bonus_records').select('*').eq('record_no',no).single();
  if(!b){toast('找不到記錄','e');return;}
  OM(`編輯獎金記錄：${no}`, bonusForm(b),
    `<button class="btn" onclick="CM()">取消</button>
     <button class="btn btn-p" onclick="updateBonus('${no}')">儲存</button>`
  );
}

async function updateBonus(no){
  const rec=v('brec'), amt=n('bamt');
  if(!rec||!amt){toast('請填寫對象和金額','e');return;}
  const dir=v('bdir').startsWith('收入')?'收入':'支出';
  const{error}=await sb.from('bonus_records').update({
    record_date:v('bdt'), direction:dir, recipient:rec,
    type:v('btype'), amount:amt, payment_method:v('bpay'),
    invoice_no:v('binv')||null, payment_date:v('bpdt')||null,
    note:v('bnote')||null,
    payer:v('bpayer')||null,
    trigger_who:v('btrigger')||null,
    year_month:ym(v('bdt'))
  }).eq('record_no',no);
  if(error){toast('更新失敗：'+error.message,'e');return;}
  toast('記錄已更新');CM();bonus();
}

window.showBonus=showBonus;
window.editBonus=editBonus;
window.updateBonus=updateBonus;
window.toggleBonusFields=toggleBonusFields;
</script>

<script>
// ═══════════════════════════
//  補貨清單功能
// ═══════════════════════════
async function showRestockList() {
  const { data: lowProds } = await sb.from('products')
    .select('product_no,name,spec,category,stock,cost,source')
    .eq('is_active',true).lte('stock',5).not('product_no','is',null).order('stock').order('name');

  let srcSettings = {};
  try {
    const { data: s } = await sb.from('settings').select('value').eq('key','restock_sources').single();
    if(s?.value) srcSettings = JSON.parse(s.value);
  } catch(e) {}

  const all = lowProds || [];
  const allSources = [...new Set(all.map(p=>p.source||'未分類'))].sort();
  const srcOrder  = srcSettings.order    || {};
  const srcHidden = srcSettings.hidden   || [];
  const catHidden = srcSettings.catHidden || [];
  const catOrder  = srcSettings.catOrder  || {};
  window._rstCatOrder = catOrder;

  // 過濾掉隱藏類別
  const filtered = all.filter(p => !catHidden.includes(p.category||'未分類'));

  const shownSrcs = allSources
    .filter(s => !srcHidden.includes(s))
    .sort((a,b) => (srcOrder[a]||99)-(srcOrder[b]||99) || a.localeCompare(b));

  window._rstProds = all;
  window._rstFiltered = filtered;
  window._rstSrc = '全部';
  window._rstAllSrcs = allSources;

  function renderRows(src) {
    const list = (src==='全部' ? filtered : filtered.filter(p=>(p.source||'未分類')===src));
    if(!list.length) return '<div style="text-align:center;color:var(--tx3);padding:20px;font-size:13px">此來源無需補貨商品</div>';

    // 依類別分組
    const groups = {};
    list.forEach(p => {
      const cat = p.category || '未分類';
      if(!groups[cat]) groups[cat] = [];
      groups[cat].push(p);
    });
    // 類別內排序
    const sortBy = window._rstSortBy || 'stock';
    Object.values(groups).forEach(arr => arr.sort((a,b)=>{
      if(sortBy==='stock') return a.stock-b.stock;
      if(sortBy==='name') return a.name.localeCompare(b.name);
      return 0;
    }));

    return Object.entries(groups).sort((a,b)=>{
      const oa=(window._rstCatOrder&&window._rstCatOrder[a[0]])||99;
      const ob=(window._rstCatOrder&&window._rstCatOrder[b[0]])||99;
      return oa-ob||a[0].localeCompare(b[0]);
    }).map(([cat, items]) => {
      const zeroCount = items.filter(p=>p.stock<=0).length;
      const rows = items.map(p=>{
        const tag = p.stock<=0
          ? '<span class="badge br2" style="font-size:11px">缺貨</span>'
          : `<span class="badge ba" style="font-size:11px">剩 ${p.stock}</span>`;
        return `<tr style="border-bottom:1px solid var(--bd)">
          <td style="padding:7px 6px 7px 20px"><label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" class="restock-cb" data-no="${p.product_no}" data-name="${p.name.replace(/"/g,'&quot;')}"
              style="width:15px;height:15px;cursor:pointer" ${p.stock<=0?'checked':''}>
            <div><div style="font-size:14px">${p.name}</div>
            <div style="font-size:11px;color:var(--tx3)">${p.spec||''}</div></div>
          </label></td>
          <td style="padding:7px 6px;text-align:center">${tag}</td>
          <td style="padding:7px 6px;text-align:center">
            <input type="number" class="restock-qty" data-no="${p.product_no}" value="${p.stock<=0?3:1}" min="1"
              style="width:58px;padding:4px 5px;border:1px solid var(--bd);border-radius:var(--r);font-size:14px;text-align:center;outline:none">
          </td></tr>`;
      }).join('');

      const catId = 'cat-'+cat.replace(/[^a-zA-Z0-9一-鿿]/g,'_');
      return `<tr><td colspan="3" style="background:var(--sf2);padding:6px 8px;border-bottom:1px solid var(--bd)">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="${catId}" checked
            style="width:15px;height:15px;cursor:pointer"
            onchange="window._toggleCat('${catId}',this.checked)">
          <span style="font-size:12px;font-weight:700;color:var(--tx2);letter-spacing:.3px">${cat}</span>
          <span style="font-size:11px;font-weight:400;color:var(--tx3)">${items.length} 項${zeroCount?'・缺貨 '+zeroCount:''}</span>
        </label>
      </td></tr>${rows}`;
    }).join('');
  }

  function buildTabs() {
    return ['全部',...shownSrcs].map(s=>{
      const cnt = s==='全部' ? filtered.length : filtered.filter(p=>(p.source||'未分類')===s).length;
      const on = s===window._rstSrc?' on':'';
      return `<div class="tab${on}" onclick="window._switchRstTab('${s}')" style="white-space:nowrap">
        ${s} <span style="font-size:11px;opacity:.6">(${cnt})</span></div>`;
    }).join('');
  }

  OM('補貨清單', `
  <div class="al al-w" style="font-size:12px;margin-bottom:8px">勾選要補貨的商品，填入數量，點「建立進貨單」自動帶入。</div>
  <div style="display:flex;align-items:center;gap:4px;margin-bottom:8px">
    <div id="rst-tabs" style="display:flex;gap:2px;overflow-x:auto;flex:1;border-bottom:1px solid var(--bd)">${buildTabs()}</div>
    <button onclick="window._showRstSettings()" title="設定顯示與排序"
      style="flex-shrink:0;padding:5px 10px;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf2);cursor:pointer;font-size:15px;margin-left:4px">⚙</button>
  </div>
  <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap">
    <button class="btn btn-s" onclick="document.querySelectorAll('.restock-cb').forEach(c=>c.checked=true)">全選</button>
    <button class="btn btn-s" onclick="document.querySelectorAll('.restock-cb').forEach(c=>c.checked=false)">全不選</button>
    <select onchange="window._rstSortBy=this.value;window._switchRstTab(window._rstSrc)"
      style="padding:4px 8px;border:1px solid var(--bd);border-radius:var(--r);font-size:12px;background:var(--sf);outline:none">
      <option value="stock">排序：缺貨優先</option>
      <option value="name">排序：品名 A→Z</option>
    </select>
    <span id="rst-stats" style="font-size:12px;color:var(--tx3)">共 ${filtered.length} 項</span>
  </div>
  <table style="width:100%">
    <thead><tr style="border-bottom:2px solid var(--bd)">
      <th style="padding:6px;font-size:12px;font-weight:600;text-align:left">商品</th>
      <th style="padding:6px;font-size:12px;font-weight:600;width:70px">庫存</th>
      <th style="padding:6px;font-size:12px;font-weight:600;width:80px">補貨量</th>
    </tr></thead>
    <tbody id="rst-tbody">${renderRows('全部')}</tbody>
  </table>`,
  `<button class="btn" onclick="CM()">關閉</button>
   <button class="btn btn-p" onclick="createRestockPO()">📋 建立進貨單</button>`);

  window._rstSortBy = window._rstSortBy || 'stock';

  window._toggleCat = (catId, checked) => {
    // 找到這個類別下所有 checkbox（在 catId 之後、下一個類別之前）
    const header = document.getElementById(catId);
    if(!header) return;
    const headerRow = header.closest('tr');
    let row = headerRow?.nextElementSibling;
    while(row) {
      const cb = row.querySelector('.restock-cb');
      if(!cb) break;  // 遇到下一個類別標題（無 .restock-cb 的 tr）
      cb.checked = checked;
      row = row.nextElementSibling;
    }
  };

  window._switchRstTab = src => {
    window._rstSrc = src;
    const wrap=document.getElementById('rst-tabs'); if(wrap) wrap.innerHTML=buildTabs();
    const tbody=document.getElementById('rst-tbody'); if(tbody) tbody.innerHTML=renderRows(src);
    const stats=document.getElementById('rst-stats');
    if(stats){
      const list=src==='全部'?filtered:filtered.filter(p=>(p.source||'未分類')===src);
      stats.textContent=`缺貨 ${list.filter(p=>p.stock<=0).length} 項・低庫存 ${list.filter(p=>p.stock>0).length} 項`;
    }
  };

  window._showRstSettings = () => {
    const allCats = [...new Set(all.map(p=>p.category||'未分類'))].sort();
    const srcRows = allSources.map(s=>{
      const ord=srcOrder[s]||99, hid=srcHidden.includes(s), cnt=all.filter(p=>(p.source||'未分類')===s).length;
      return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)">
        <input type="number" id="rstord-${s}" value="${ord}" min="1" max="99"
          style="width:44px;padding:4px;border:1px solid var(--bd);border-radius:var(--r);font-size:12px;text-align:center">
        <label style="flex:1;display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="rstvis-${s}" ${!hid?'checked':''} style="width:14px;height:14px">
          <span style="font-weight:500">${s}</span><span style="font-size:11px;color:var(--tx3)">${cnt} 項</span>
        </label></div>`;
    }).join('');

    const allCatsSorted = [...new Set(all.map(p=>p.category||'未分類'))].sort((a,b)=>{
      return (catOrder[a]||99)-(catOrder[b]||99)||a.localeCompare(b);
    });
    const catRows = allCatsSorted.map(c=>{
      const hid=catHidden.includes(c), ord=catOrder[c]||99, cnt=all.filter(p=>(p.category||'未分類')===c).length;
      return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)">
        <input type="number" id="rstcatord-${c}" value="${ord}" min="1" max="99"
          style="width:44px;padding:4px;border:1px solid var(--bd);border-radius:var(--r);font-size:12px;text-align:center"
          title="排序（數字越小越前）">
        <label style="flex:1;display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="rstcat-${c}" ${!hid?'checked':''} style="width:14px;height:14px">
          <span>${c}</span><span style="font-size:11px;color:var(--tx3)">${cnt} 項</span>
        </label>
      </div>`;
    }).join('');

    OM2('補貨清單設定', `
    <div class="sh">來源顯示與排序</div>
    <div style="font-size:12px;color:var(--tx3);margin-bottom:8px">數字=排序（越小越前），勾選=是否顯示</div>
    ${srcRows}
    <div class="sh" style="margin-top:14px">類別篩選（不勾 = 不出現在補貨清單）</div>
    <div style="font-size:12px;color:var(--tx3);margin-bottom:8px">左邊數字設排序（依你的銷售重要程度），不勾 = 不顯示（例如輔消品）</div>
    ${catRows}`,
    `<button class="btn" onclick="CM2()">取消</button>
     <button class="btn btn-p" onclick="window._saveRstSettings()">儲存設定</button>`);
  };

  window._saveRstSettings = async () => {
    const allCats2 = [...new Set(all.map(p=>p.category||'未分類'))].sort();
    const newOrder={}, newHidden=[], newCatHidden=[];
    allSources.forEach(s=>{
      newOrder[s] = parseInt(document.getElementById('rstord-'+s)?.value)||99;
      if(!document.getElementById('rstvis-'+s)?.checked) newHidden.push(s);
    });
    const newCatOrder = {};
    allCats2.forEach(c=>{
      if(!document.getElementById('rstcat-'+c)?.checked) newCatHidden.push(c);
      newCatOrder[c] = parseInt(document.getElementById('rstcatord-'+c)?.value)||99;
    });
    await sb.from('settings').upsert({
      key:'restock_sources',
      value: JSON.stringify({order:newOrder,hidden:newHidden,catHidden:newCatHidden,catOrder:newCatOrder}),
      updated_at: new Date().toISOString()
    });
    toast('設定已儲存');
    CM2();
    showRestockList();
  };
}

window.showRestockList = showRestockList;




async function createRestockPO() {
  const selected = [];
  document.querySelectorAll('.restock-cb:checked').forEach(cb => {
    const no = cb.dataset.no, name = cb.dataset.name;
    const qty = parseInt(document.querySelector(`.restock-qty[data-no="${no}"]`)?.value) || 1;
    selected.push({ no, name, qty });
  });
  if(!selected.length) { toast('請勾選至少一項商品','e'); return; }
  const { data: prods } = await sb.from('products').select('product_no,name,spec,cost').in('product_no', selected.map(s=>s.no));
  const prodMap = {};
  (prods||[]).forEach(p => prodMap[p.product_no] = p);
  CM();
  if(!window.loadPOForm){toast('系統錯誤：loadPOForm 未載入','e');return;}
  try { await window.loadPOForm(); } catch(e) { toast('開表單失敗：'+e.message,'e'); console.error('[createRestockPO]',e); return; }
  window._setPoItems(selected.map(s => {
    const p = prodMap[s.no];
    return { id: Date.now()+Math.random(), pno: s.no, _pname: p?.name||s.name, qty: s.qty, price: p?.cost||0, giftQty: 0, amt: s.qty*(p?.cost||0) };
  }));
  window._renderPOItems();
  toast('✅ 已帶入 '+selected.length+' 項商品，請選廠商後儲存');
}
window.createRestockPO = createRestockPO;
window._createRestockPO = createRestockPO;
</script>

<script>
// ════════════════════════════
//  品牌商管理
// ════════════════════════════
async function brands() {
  const { data, count } = await sb.from('brands').select('*',{count:'exact'}).order('sort_order').order('name');
  $('main').innerHTML = `
  <div class="ph"><div><div class="pt">品牌商</div><div class="ps">${count||0} 個品牌</div></div>
    <div class="ha"><button class="btn btn-p btn-s" onclick="addBrand()">＋ 新增品牌</button></div></div>
  <div class="pc">
    <div class="al al-w" style="font-size:12px">記錄合作的品牌商（製造商/代理品牌），方便管理商品來源。</div>
    <div class="tc"><div class="tb"><span class="tt">品牌列表</span></div>
    <div class="tw"><table>
      <tr><th>排序</th><th>品牌名稱</th><th>類型</th><th>產地/來源</th><th>官網</th><th>備註</th><th>狀態</th><th>操作</th></tr>
      ${(data||[]).map(b=>`<tr style="${b.is_active===false?'opacity:.5':''}">
        <td style="text-align:center">
          <input type="number" value="${b.sort_order||99}" min="1" max="999"
            style="width:50px;padding:3px 5px;border:1px solid var(--bd);border-radius:var(--r);font-size:12px;text-align:center;outline:none"
            onchange="setBrandSort(${b.id},this.value)" title="數字越小排越前面">
        </td>
        <td style="font-weight:500">${b.name}${b.is_active===false?'<span class="badge br2" style="margin-left:5px;font-size:10px">停用</span>':''}</td>
        <td>${b.category||'—'}</td>
        <td>${b.origin||'—'}</td>
        <td>${b.website?`<a href="${b.website}" target="_blank" style="color:var(--ac);font-size:12px">${b.website.replace(/^https?:\/\//,'').split('/')[0]}</a>`:'—'}</td>
        <td style="font-size:12px;color:var(--tx2);max-width:150px">${b.note||'—'}</td>
        <td><span class="badge ${b.is_active===false?'br2':'bg'}">${b.is_active===false?'停用':'啟用'}</span></td>
        <td><div style="display:flex;gap:3px">
          <button class="btn btn-s" onclick="editBrand(${b.id})">編輯</button>
          <button class="btn btn-s" style="color:${b.is_active===false?'var(--ac)':'var(--am)'};border-color:currentColor"
            onclick="toggleBrand(${b.id},${b.is_active!==false})">${b.is_active===false?'啟用':'停用'}</button>
          <button class="btn btn-s btn-r" onclick="deleteBrand(${b.id},'${b.name.replace(/'/g,"\\'")}')" >刪</button>
        </div></td>
      </tr>`).join('')}
    </table></div></div>
  </div>`;
}

function brandForm(b) {
  b = b||{};
  return `<div class="fg">
    ${fi('bname','品牌名稱 *','text',b.name)}
    ${fs('bcategory','品牌類型',['保養品牌','保健品牌','美髮品牌','化妝品牌','輔消品牌','其他'],b.category||'保養品牌')}
    ${fi('borigin','產地/來源國','text',b.origin)}
    ${fi('bwebsite','官網','text',b.website)}
    <div class="fl fw">${fa('bnote2','備註',b.note)}</div>
  </div>`;
}

function addBrand() {
  OM('新增品牌商', brandForm(), `<button class="btn" onclick="CM()">取消</button><button class="btn btn-p" onclick="saveBrand(false)">新增</button>`);
}

async function editBrand(id) {
  const{data:b}=await sb.from('brands').select('*').eq('id',id).single();
  OM('編輯品牌商', brandForm(b), `<button class="btn" onclick="CM()">取消</button><button class="btn btn-p" onclick="saveBrand(${id})">儲存</button>`);
}

async function saveBrand(editId) {
  const nm=v('bname');
  if(!nm){toast('請填寫品牌名稱','e');return;}
  const obj={name:nm,category:v('bcategory'),origin:v('borigin')||null,website:v('bwebsite')||null,note:v('bnote2')||null,is_active:true};
  if(editId){await sb.from('brands').update(obj).eq('id',editId);}
  else{await sb.from('brands').insert(obj);}
  toast(editId?'品牌已更新':'品牌新增成功！');CM();brands();
}

async function setBrandSort(id,val){
  await sb.from('brands').update({sort_order:parseInt(val)||99}).eq('id',id);
  brands();
}

async function toggleBrand(id,active){
  await sb.from('brands').update({is_active:!active}).eq('id',id);
  toast(!active?'品牌已啟用':'品牌已停用');brands();
}

async function deleteBrand(id,name){
  if(!confirm(`確定刪除品牌「${name}」？`))return;
  await sb.from('brands').delete().eq('id',id);
  toast('品牌已刪除');brands();
}

window.brands=brands; window.addBrand=addBrand; window.editBrand=editBrand;
window.saveBrand=saveBrand; window.setBrandSort=setBrandSort;
window.toggleBrand=toggleBrand; window.deleteBrand=deleteBrand;
</script><script>
// ════════════════════════
//  商品頁來源順序設定
// ════════════════════════
async function showProdSrcSettings() {
  const srcs   = window._prodAllSrcs  || [];
  const ord    = window._prodSrcOrd   || {};
  const hidden = window._prodSrcHidden|| [];
  if (!srcs.length) { toast('目前無來源資料','w'); return; }

  const sorted = srcs.slice().sort((a,b) => (ord[a]||99)-(ord[b]||99) || a.localeCompare(b));
  const rows = sorted.map(s => {
    const isHid = hidden.includes(s);
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);${isHid?'opacity:.5':''}">
      <input type="number" id="psord-${s}" value="${ord[s]||99}" min="1" max="99"
        style="width:46px;padding:4px;border:1px solid var(--bd);border-radius:var(--r);font-size:12px;text-align:center">
      <label style="flex:1;display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="psvis-${s}" ${!isHid?'checked':''} style="width:14px;height:14px">
        <span style="font-weight:500">${s}</span>
        ${isHid?'<span class="badge br2" style="font-size:10px">已停用</span>':''}
      </label>
    </div>`;
  }).join('');

  OM('商品來源設定', `
  <div style="font-size:12px;color:var(--tx3);margin-bottom:12px">
    數字設排序（1=最前）；不勾 = 停用該來源（Tab 隱藏，商品從列表消失）。
  </div>
  ${rows}`,
  `<button class="btn" onclick="CM()">取消</button>
   <button class="btn btn-p" onclick="saveProdSrcSettings()">儲存</button>`);
}

async function saveProdSrcSettings() {
  const srcs = window._prodAllSrcs || [];
  const newOrd = {}, newHidden = [];
  srcs.forEach(s => {
    const ordEl = document.getElementById('psord-'+s);
    const visEl = document.getElementById('psvis-'+s);
    if (ordEl) newOrd[s] = parseInt(ordEl.value)||99;
    if (visEl && !visEl.checked) newHidden.push(s);
  });
  await sb.from('settings').upsert({
    key: 'prod_src_order',
    value: JSON.stringify({order:newOrd, hidden:newHidden}),
    updated_at: new Date().toISOString()
  });
  toast('設定已儲存');
  CM();
  window._prodSrcOrd    = newOrd;
  window._prodSrcHidden = newHidden;
  products();
}

window.showProdSrcSettings = showProdSrcSettings;
window.saveProdSrcSettings = saveProdSrcSettings;
</script>
<script>
// ══════════════════════════════
//  類別管理 + 商品類別下拉選單
// ══════════════════════════════

// 全域類別快取
window._cats = [];
async function loadCats() {
  const { data } = await sb.from('products').select('category').not('category','is',null);
  window._cats = [...new Set((data||[]).map(x=>x.category).filter(Boolean))].sort();
  return window._cats;
}

// 類別管理頁面
async function categories() {
  const cats = await loadCats();
  $('main').innerHTML = `
  <div class="ph"><div><div class="pt">類別管理</div><div class="ps">${cats.length} 個類別</div></div>
    <div class="ha"><button class="btn btn-p btn-s" onclick="addCategoryModal()">＋ 新增類別</button></div></div>
  <div class="pc">
    <div class="al al-w" style="font-size:12px">
      管理商品類別。類別名稱修改後，現有商品的類別不會自動更新，請至商品列表手動更新。
    </div>
    <div class="tc"><div class="tb"><span class="tt">類別列表</span></div>
    <div class="tw"><table>
      <tr><th>類別名稱</th><th>商品數量</th><th>操作</th></tr>
      ${cats.map(c => {
        const cnt = 0; // 可以另外查
        return `<tr>
          <td style="font-weight:500;font-size:14px">${c}</td>
          <td><span class="badge bg" style="font-size:11px">${c}</span></td>
          <td><div style="display:flex;gap:4px">
            <button class="btn btn-s" onclick="renameCategoryModal('${c.replace(/'/g,"\\'")}')">改名</button>
          </div></td>
        </tr>`;
      }).join('')}
    </table></div></div>
  </div>`;
  
  // 補上各類別商品數量
  const { data: cnts } = await sb.from('products').select('category').eq('is_active',true);
  const catCount = {};
  (cnts||[]).forEach(x => { if(x.category) catCount[x.category] = (catCount[x.category]||0)+1; });
  
  // 重新渲染（含數量）
  $('main').innerHTML = `
  <div class="ph"><div><div class="pt">類別管理</div><div class="ps">${cats.length} 個類別</div></div>
    <div class="ha"><button class="btn btn-p btn-s" onclick="addCategoryModal()">＋ 新增類別</button></div></div>
  <div class="pc">
    <div class="al al-w" style="font-size:12px">管理商品類別。新增類別後，在編輯商品時可從下拉選單選擇。</div>
    <div class="tc"><div class="tb"><span class="tt">類別列表</span></div>
    <div class="tw"><table>
      <tr><th>類別名稱</th><th>使用中商品</th><th>操作</th></tr>
      ${cats.map(c => `<tr>
        <td style="font-weight:500;font-size:15px">${c}</td>
        <td style="text-align:center"><span class="badge bg">${catCount[c]||0} 項</span></td>
        <td><button class="btn btn-s" onclick="renameCategoryModal('${c.replace(/'/g,"\\'")}')">改名</button></td>
      </tr>`).join('')}
    </table></div></div>
  </div>`;
}

function addCategoryModal() {
  OM('新增類別',
    fi('newcat','類別名稱 *'),
    `<button class="btn" onclick="CM()">取消</button>
     <button class="btn btn-p" onclick="saveNewCategory()">新增</button>`);
}

async function saveNewCategory() {
  const nm = v('newcat').trim();
  if(!nm) { toast('請輸入類別名稱','e'); return; }
  if(window._cats.includes(nm)) { toast('此類別已存在','w'); return; }
  // 類別不需要獨立表，直接新增一個暫時商品再更新不對
  // 改為：存到 settings 表的 custom_categories
  let existing = [];
  try {
    const { data: s } = await sb.from('settings').select('value').eq('key','custom_categories').single();
    if(s?.value) existing = JSON.parse(s.value);
  } catch(e){}
  if(!existing.includes(nm)) {
    existing.push(nm);
    await sb.from('settings').upsert({key:'custom_categories', value:JSON.stringify(existing), updated_at:new Date().toISOString()});
  }
  window._cats = [...new Set([...window._cats, nm])].sort();
  toast('類別已新增：'+nm);
  CM();
  categories();
}

async function renameCategoryModal(oldName) {
  OM(`改名類別：${oldName}`,
    fi('rencat','新類別名稱 *','text',oldName),
    `<button class="btn" onclick="CM()">取消</button>
     <button class="btn btn-p" onclick="renameCategory('${oldName.replace(/'/g,"\\'")}')">確認改名</button>`);
}

async function renameCategory(oldName) {
  const newName = v('rencat').trim();
  if(!newName || newName===oldName) { CM(); return; }
  if(!confirm(`確定把「${oldName}」改名為「${newName}」？\n這會批次更新所有使用此類別的商品。`)) return;
  const { error } = await sb.from('products').update({category:newName}).eq('category',oldName);
  if(error) { toast('更新失敗：'+error.message,'e'); return; }
  toast(`已更新「${oldName}」→「${newName}」`);
  window._cats = window._cats.map(c => c===oldName?newName:c).sort();
  CM();
  categories();
}

// 讓商品編輯表單的類別欄改成下拉選單
// 攔截 fi('cat',...) 改為 select
const _origFi = window.fi || null;
window.makeCatSelect = (currentVal) => {
  const cats = window._cats || [];
  const opts = [...new Set([...cats, currentVal||''].filter(Boolean))].sort();
  return `<div class="fl"><label>類別</label><select id="f-cat"
    style="width:100%;padding:7px 8px;border:1px solid var(--bd);border-radius:var(--r);font-size:13px;background:var(--sf);outline:none">
    <option value="">— 選擇類別 —</option>
    ${opts.map(c=>`<option value="${c}" ${c===currentVal?'selected':''}>${c}</option>`).join('')}
    <option value="__new__">＋ 新增類別…</option>
  </select></div>`;
};

window.categories = categories;
window.addCategoryModal = addCategoryModal;
window.saveNewCategory = saveNewCategory;
window.renameCategoryModal = renameCategoryModal;
window.renameCategory = renameCategory;

// loadCats 由 categories() 頁面或 prodForm 需要時才呼叫
</script>
<script>
// 進貨廠商排序設定
async function showPuVendorSettings() {
  const vendors = (window._puVendors||[]).filter(v=>v!=='全部');
  let ord = {};
  try {
    const {data:s} = await sb.from('settings').select('value').eq('key','pu_vendor_order').single();
    if(s?.value) ord = JSON.parse(s.value);
  } catch(e){}
  const sorted = vendors.slice().sort((a,b)=>(ord[a]||99)-(ord[b]||99)||a.localeCompare(b));
  const rows = sorted.map(v => `
    <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)">
      <input type="number" id="puvo-${v}" value="${ord[v]||99}" min="1" max="99"
        style="width:46px;padding:4px;border:1px solid var(--bd);border-radius:var(--r);font-size:12px;text-align:center">
      <span style="flex:1;font-weight:500">${v}</span>
    </div>`).join('');
  OM('進貨廠商排序設定', `
    <div style="font-size:12px;color:var(--tx3);margin-bottom:10px">數字越小排越前面（1=最前）</div>
    ${rows}`,
    `<button class="btn" onclick="CM()">取消</button>
     <button class="btn btn-p" onclick="savePuVendorSettings()">儲存</button>`);
}

async function savePuVendorSettings() {
  const vendors = (window._puVendors||[]).filter(v=>v!=='全部');
  const newOrd = {};
  vendors.forEach(v => {
    const el = document.getElementById('puvo-'+v);
    if(el) newOrd[v] = parseInt(el.value)||99;
  });
  await sb.from('settings').upsert({key:'pu_vendor_order', value:JSON.stringify(newOrd), updated_at:new Date().toISOString()});
  toast('廠商排序已儲存'); CM(); purchase();
}

window.showPuVendorSettings = showPuVendorSettings;
window.savePuVendorSettings = savePuVendorSettings;
</script>
