<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>慢樂仙坊・進銷存系統</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<aside class="sdb">
  <div class="sl" onclick="go('dashboard')">
    <div id="logo-area" style="display:flex;align-items:center;gap:8px;margin-bottom:2px;cursor:pointer">
      <img id="logo-img" src="" alt="" style="max-height:48px;max-width:160px;display:none;border-radius:4px">
      <div id="logo-text">
        <div style="font-weight:700;font-size:15px;color:var(--tx)" id="shop-name">慢樂仙坊</div>
        <div style="font-size:11px;color:var(--tx3)">進銷存管理系統</div>
      </div>
    </div>
    <div style="font-size:10px;color:var(--tx3);margin-top:4px;cursor:pointer" onclick="event.stopPropagation();document.getElementById('logo-upload').click()">點擊上傳 LOGO</div>
    <input type="file" id="logo-upload" accept="image/*" style="display:none" onchange="handleLogoUpload(this)">
  </div>

  <div class="ns">總覽</div>
  <div class="ni on" data-p="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span>總覽</span></div>

  <div class="ns">商品</div>
  <div class="ni" data-p="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg><span>商品列表</span></div>
  <div class="ni" data-p="promotions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span>活動/套組</span></div>

  <div class="ns">進貨</div>
  <div class="ni" data-p="purchase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg><span>進貨管理</span></div>

  <div class="ns">銷售</div>
  <div class="ni" data-p="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg><span>銷售訂單</span></div>
  <div class="ni" data-p="serviceHub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>服務管理</span></div>

  <div class="ns">客戶</div>
  <div class="ni" data-p="customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>客戶資料</span></div>
  <div class="ni" data-p="svcCredits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg><span>客戶儲值</span></div>
  <div class="ni" data-p="customerDeposits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12V22H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg><span>客戶寄放</span></div>

  <div class="ns">財務</div>
  <div class="ni" data-p="accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>對帳記錄</span></div>
  <div class="ni" data-p="bonus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg><span>獎金/分潤</span></div>
  <div class="ni" data-p="opex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 13h6M9 17h4"/></svg><span>營運成本</span></div>

  <div class="ns">廠商</div>
  <div class="ni" data-p="vendors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg><span>廠商管理</span></div>
  <div class="ni" data-p="brands"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg><span>品牌商</span></div>

  <div class="ns">借貸</div>
  <div class="ni" data-p="loans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/></svg><span>借貨管理</span></div>
  <div class="ni" data-p="loanParties"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><line x1="19" y1="8" x2="23" y2="8"/></svg><span>借貨對象名單</span></div>

  <div class="ns">系統</div>
  <div class="ni" data-p="categories"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>類別管理</span></div>
  <div class="ni" data-p="auditLogs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg><span>操作記錄</span></div>
  <div class="ni" data-p="dataImport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>資料匯入</span></div>
  <div style="padding:12px 16px 16px;border-top:1px solid var(--bd)">
    <button onclick="changePassword()" style="width:100%;padding:8px;background:none;border:1px solid var(--bd);border-radius:var(--r);color:var(--tx3);font-size:12px;cursor:pointer;margin-bottom:6px">
      🔑 修改密碼
    </button>
    <button onclick="logout()" style="width:100%;padding:9px;background:none;border:1px solid var(--bd);border-radius:var(--r);color:var(--tx3);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      登出
    </button>
  </div>
</aside>
<div class="sidebar-overlay" id="sdbOverlay" onclick="closeSidebar()"></div>
<!-- 手機頂部固定 bar -->
<div id="mobile-topbar">
  <button id="mobile-hamburger" onclick="openSidebar()" aria-label="開啟選單">
    <span></span><span></span><span></span>
  </button>
  <div id="mobile-logo-area" onclick="changeLogo()" title="點擊更換 LOGO" style="cursor:pointer">
    <img id="mobile-logo-img" src="" style="display:none;max-height:32px;max-width:120px;object-fit:contain;border-radius:4px">
    <span id="mobile-logo-text" style="font-size:14px;font-weight:700;color:var(--tx)">慢樂仙坊</span>
  </div>
</div>
<main class="main" id="main"><div class="ld"><div class="sp"></div>載入中…</div></main>
</div>
<div class="mo" id="modal2" style="z-index:250">
  <div class="md" id="md2" style="max-width:500px;width:100%">
    <div class="mh"><span class="mt" id="m2title"></span><button class="btn btn-s" onclick="CM2()">✕</button></div>
    <div class="mb" id="m2body"></div>
    <div class="mf" id="m2foot"></div>
  </div>
</div>
<div class="mo" id="modal"><div class="md" id="md"><div class="mh"><span class="mt" id="mtitle"></span><button class="btn btn-s" onclick="CM()">✕</button></div><div class="mb" id="mbody"></div><div class="mf" id="mfoot"></div></div></div>
<div class="toast" id="toast"></div>


  <!-- 核心（最先載入：全域變數、工具函數、boot）-->
  <script src="js/core.js"></script>
  <!-- 各功能模組 -->
  <script src="js/products.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/purchase.js"></script>
  <script src="js/loans.js"></script>
  <script src="js/customers.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/vendors.js"></script>
  <script src="js/promotions.js"></script>
  <script src="js/restock.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/misc.js"></script>
  <script src="js/service-core.js"></script>
  <script src="js/service-orders.js"></script>
  <script src="js/service-inventory.js"></script>
  <script src="js/service-credits.js"></script>
  <script src="js/service-items.js"></script>
  <script src="js/import.js"></script>
  <script src="js/customer-deposits.js"></script>
  <script src="js/service-kits.js"></script>
</body>
</html>
