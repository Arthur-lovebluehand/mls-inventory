<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>慢樂仙坊・進銷存系統</title>
<style>
:root{--bg:#f7f5f0;--sf:#fff;--sf2:#f0ede6;--bd:#e2ddd5;--tx:#1a1714;--tx2:#6b6560;--tx3:#9e9890;--ac:#5c7a5c;--acl:#edf3ed;--rd:#c0392b;--rdl:#fdf0ef;--am:#b8860b;--aml:#fef9e7;--bl:#2c5f8a;--bll:#eef4fb;--br:#8b5e3c;--brl:#f7f0ea;--r:7px;--rl:11px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,'Noto Sans TC',sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
.app{display:flex;min-height:100vh}
.sdb{width:210px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}
.main{margin-left:210px;min-height:100vh}
.logo{padding:16px;border-bottom:1px solid var(--bd)}
.logo h1{font-size:15px;font-weight:700;color:var(--ac)}
.logo p{font-size:11px;color:var(--tx3);margin-top:2px}
.ns{padding:10px 16px 3px;font-size:10px;font-weight:600;color:var(--tx3);letter-spacing:1px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;color:var(--tx2);font-size:13px;border-left:3px solid transparent}
.ni:hover{background:var(--sf2)}
.ni.on{background:var(--acl);color:var(--ac);border-left-color:var(--ac);font-weight:500}
.ni svg{width:15px;height:15px;flex-shrink:0;opacity:.7}.ni.on svg{opacity:1}
/* page */
.ph{background:var(--sf);border-bottom:1px solid var(--bd);padding:13px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.pt{font-size:15px;font-weight:600}.ps{font-size:11px;color:var(--tx3);margin-top:1px}
.ha{display:flex;gap:7px}
.pc{padding:18px 22px}
/* metrics */
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.mc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:13px}
.ml{font-size:10px;color:var(--tx3);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.mv{font-size:22px;font-weight:700}.ms{font-size:11px;color:var(--tx3);margin-top:2px}
.cg{color:var(--ac)}.cr{color:var(--rd)}.cb{color:var(--bl)}.cbr{color:var(--br)}
/* table */
.tc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);overflow:hidden;margin-bottom:16px}
.tb{padding:10px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tt{font-size:13px;font-weight:600;flex:1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 12px;font-size:10px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;background:var(--sf2);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--bd);vertical-align:middle;font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--sf2)}
.pg{padding:10px 14px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.pi{font-size:11px;color:var(--tx3)}
/* badges */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.bg{background:var(--acl);color:var(--ac)}.br2{background:var(--rdl);color:var(--rd)}.ba{background:var(--aml);color:var(--am)}.bb{background:var(--bll);color:var(--bl)}.bgr{background:var(--sf2);color:var(--tx2)}.bbr{background:var(--brl);color:var(--br)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);white-space:nowrap}
.btn:hover{background:var(--sf2)}.btn-p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn-p:hover{background:#4a6b4a}
.btn-r{background:var(--rd);color:#fff;border-color:var(--rd)}.btn-s{padding:4px 8px;font-size:12px}
/* modal */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto}
.mo.open{display:flex}
.md{background:var(--sf);border-radius:var(--rl);width:100%;max-width:680px;box-shadow:0 8px 32px rgba(0,0,0,.15);margin:auto}
.md-lg{max-width:860px}
.mh{padding:14px 17px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.mt{font-size:14px;font-weight:600}.mb{padding:17px}.mf{padding:12px 17px;border-top:1px solid var(--bd);display:flex;gap:7px;justify-content:flex-end}
/* form */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fg3{grid-template-columns:1fr 1fr 1fr}
.fw{grid-column:1/-1}
.fl label{display:block;font-size:11px;font-weight:600;color:var(--tx2);margin-bottom:4px}
.fl input,.fl select,.fl textarea{width:100%;padding:7px 8px;border:1px solid var(--bd);border-radius:var(--r);font-size:13px;background:var(--sf);color:var(--tx);outline:none}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--ac)}
.fl textarea{resize:vertical;min-height:55px}
/* searchable select */
.ss-wrap{position:relative}
.ss-input{width:100%;padding:7px 8px;border:1px solid var(--bd);border-radius:var(--r);font-size:13px;background:var(--sf);color:var(--tx);outline:none}
.ss-input:focus{border-color:var(--ac)}
.ss-drop{position:absolute;top:100%;left:0;right:0;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);max-height:200px;overflow-y:auto;z-index:500;display:none;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.ss-drop.open{display:block}
.ss-opt{padding:7px 10px;font-size:13px;cursor:pointer}
.ss-opt:hover,.ss-opt.sel{background:var(--acl);color:var(--ac)}
.ss-opt.no{color:var(--tx3);cursor:default}
/* item row in forms */
.ir{display:grid;gap:6px;align-items:center;background:var(--sf2);border-radius:var(--r);padding:8px;margin-bottom:6px}
.ir-order{grid-template-columns:3fr 60px 90px 60px 70px 28px}
.ir-po{grid-template-columns:3fr 70px 90px 80px 28px}
.ir-loan{grid-template-columns:3fr 70px 70px 28px}
.ir input,.ir select{font-size:12px;padding:5px 7px;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf);color:var(--tx);width:100%;outline:none}
.ir input:focus{border-color:var(--ac)}
/* loading */
.ld{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--tx3);gap:10px}
.sp{width:20px;height:20px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
/* alert */
.al{padding:9px 13px;border-radius:var(--r);font-size:13px;margin-bottom:13px}
.al-s{background:var(--acl);color:var(--ac)}.al-e{background:var(--rdl);color:var(--rd)}.al-w{background:var(--aml);color:var(--am)}
/* stock color */
.ok{color:var(--ac);font-weight:600}.lw{color:var(--am);font-weight:600}.ze{color:var(--rd);font-weight:600}
/* detail grid */
.dg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dr{display:flex;flex-direction:column;gap:2px}
.dlb{font-size:10px;color:var(--tx3);font-weight:500;text-transform:uppercase}
.dv{font-size:13px}
/* inner table */
.itb{width:100%;border-collapse:collapse;margin-top:6px}
.itb th{font-size:10px;color:var(--tx3);padding:5px 7px;text-align:left;background:var(--sf2)}
.itb td{padding:6px 7px;border-top:1px solid var(--bd);font-size:13px}
/* toast */
.toast{position:fixed;bottom:20px;right:20px;background:#1e4d1e;color:#fff;padding:9px 16px;border-radius:20px;font-size:12px;font-weight:500;z-index:400;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
/* tabs */
.tab-bar{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:14px}
.tab{padding:7px 13px;font-size:13px;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:500}
/* search box in toolbar */
.si{position:relative}
.si input{padding:6px 8px 6px 27px;border:1px solid var(--bd);border-radius:var(--r);font-size:12px;background:var(--bg);color:var(--tx);width:185px;outline:none}
.si input:focus{border-color:var(--ac)}
.si svg{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:12px;height:12px;color:var(--tx3);pointer-events:none}
.num{font-variant-numeric:tabular-nums}
/* print */
@media print{
  .sdb,.ph .ha,.btn,.pg,.no-print{display:none!important}
  .sdb{display:none!important}
  .main{margin-left:0!important}
  .ph{position:static}
  body{font-size:12px}
  .print-only{display:block!important}
}
.print-only{display:none}
/* price grid for product */
.pg7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
/* section header */
.sh{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--bd)}
@media(max-width:768px){
  html,body{overflow-x:hidden!important;width:100%!important}
  .app{width:100vw!important}
  .main{width:100vw!important;margin-left:0!important;box-sizing:border-box;overflow-x:hidden}
  /* 表格包裝可以橫向捲動 */
  .tw{overflow-x:auto!important;-webkit-overflow-scrolling:touch;display:block;width:100%}

  /* Modal 表格：超過螢幕寬度時可左右滑 */
  .mb table.itb{display:block!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch;white-space:nowrap}
  .mb table th,.mb table td{font-size:12px!important;padding:7px 8px!important;white-space:nowrap}
  /* 只有非表格元素才限制寬度 */
  .pc>*:not(.tc){max-width:100%;box-sizing:border-box}
  .sdb{position:fixed;top:0;left:0;bottom:0;z-index:300;transform:translateX(-100%);transition:transform .25s ease;width:240px!important;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  .sdb.open{transform:translateX(0)}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:299}
  .sidebar-overlay.open{display:block}
  .main{margin-left:0!important}
  .hamburger{display:flex;flex-direction:column;justify-content:center;gap:5px;width:36px;height:36px;padding:7px;cursor:pointer;border:none;background:var(--sf2);border-radius:var(--r);flex-shrink:0}
  .hamburger span{display:block;height:2px;background:var(--tx);border-radius:2px}
  .hamburger-hide{display:none}
  .ph{padding:10px 14px;gap:8px}
  .pt{font-size:14px}.ps{font-size:10px}
  .ha{gap:5px;flex-wrap:wrap}
  .btn{padding:6px 10px;font-size:12px}
  .btn-s{padding:4px 7px;font-size:11px}
  .pc{padding:10px 12px}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  th,td{padding:7px 9px;font-size:12px}
  .mg{grid-template-columns:1fr 1fr;gap:8px}
  .mc{padding:10px 12px}
  .mv{font-size:18px}
  .fg,.fg3{grid-template-columns:1fr}
  .fl input,.fl select,.fl textarea{font-size:15px;padding:8px 10px}
  /* Modal → 全頁面（手機）— 用 position:fixed 最可靠 */
  .mo{padding:0;display:none;background:transparent!important}
  .mo.open{display:block}
  .md,.md-lg{
    position:fixed!important;
    top:52px!important;left:0!important;right:0!important;bottom:0!important;
    width:100%!important;max-width:100%!important;
    border-radius:0!important;
    overflow-y:auto!important;
    margin:0!important;box-sizing:border-box;
    z-index:201;
  }
  /* 防止任何元素溢出 modal 寬度 */
  .mb{width:100%;box-sizing:border-box}
  .mb :not(table):not(tr):not(td):not(th){max-width:100%;box-sizing:border-box}
  /* 強制所有 grid 在手機單欄 */
  .mb .fg,.mb .fg3,.mb .dg{grid-template-columns:1fr!important}
  /* 強制含 auto-fill 的 grid 也限制 */
  .mb [style*="repeat(auto-fill"]{grid-template-columns:repeat(2,1fr)!important}
  .mb{padding:12px 14px}
  .mh{padding:12px 14px 10px}
  /* modal 裡 dg 改單欄 */
  .mb .dg{grid-template-columns:1fr!important}
  .mb .dg .dr{flex-direction:row;flex-wrap:wrap}
  .mb .dg .dlb{min-width:80px;font-size:11px}
  .mb .dg .dv{font-size:13px}
  /* modal 裡的 fg 單欄 */
  .mb .fg,.mb .fg3{grid-template-columns:1fr!important}
  /* tab 文字不換行 */
  .tab{font-size:12px;padding:7px 10px;white-space:nowrap}
  .tab-bar{overflow-x:auto;flex-wrap:nowrap}
  /* 按鈕區換行 */
  .mf{flex-wrap:wrap;gap:6px}
  .mf .btn{flex:1;min-width:80px;text-align:center;font-size:13px;padding:9px 8px}
  /* 手機 modal 字體加大 */
  .mb{font-size:15px;line-height:1.6}
  .mb .sh{font-size:12px;margin-top:14px;letter-spacing:.5px}
  .dv{font-size:15px!important;line-height:1.5}
  .dlb{font-size:12px!important}
  .dr{padding:8px 0!important}
  /* badge 在手機夠大 */
  .badge{font-size:12px!important;padding:3px 10px!important}
  /* 價格卡片在手機 2 欄，字放大 */
  .mb [style*="grid-template-columns:repeat(4"]{grid-template-columns:repeat(2,1fr)!important}
  .mb [style*="grid-template-columns:repeat(4"] > div > div:first-child{font-size:12px!important}
  .mb [style*="grid-template-columns:repeat(4"] > div > div:last-child{font-size:18px!important}
  /* 明細表格字體 */
  /* tab 文字更大 */
  .tab{font-size:14px!important;padding:10px 14px!important}
  /* modal header */
  .mh .mt{font-size:16px!important;font-weight:700}
  /* dg grid 手機單欄 */
  .md .dg,.md-lg .dg{grid-template-columns:1fr!important}
  .ir-order{grid-template-columns:2fr 48px 68px 48px 58px 26px}
  .ir-po{grid-template-columns:2fr 48px 68px 48px 58px 26px}
  .ir-loan{grid-template-columns:2fr 68px 26px}
  .dg{grid-template-columns:1fr}
  .tab{padding:7px 11px;font-size:12px}
  .si input{width:135px}
  .sdb .logo h1,.sdb .logo p,.sdb .ni span,.sdb .ns{display:block!important}
  .sdb .ni{padding:9px 16px!important;justify-content:flex-start!important;gap:9px!important}
}
@media(max-width:400px){
  .mg{grid-template-columns:1fr}
  .ha .btn{font-size:11px;padding:4px 6px}
  .ir-order{grid-template-columns:2fr 44px 60px 44px 55px 24px}
}
/* 手機頂部固定 bar */
#mobile-topbar{
  display:none;position:fixed;top:0;left:0;right:0;height:52px;z-index:310;
  background:var(--sf);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:10px;padding:0 14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
#mobile-hamburger{
  display:flex;flex-direction:column;justify-content:center;gap:5px;
  width:36px;height:36px;padding:7px;cursor:pointer;border:none;
  background:var(--sf2);border-radius:var(--r);flex-shrink:0;
}
#mobile-hamburger span{display:block;height:2px;background:var(--tx);border-radius:2px;}
#mobile-logo-area{display:flex;align-items:center;gap:8px;flex:1;}
@media(min-width:769px){
  #mobile-topbar{display:none!important;}
  .main{padding-top:0;}
}
@media(max-width:768px){
  #mobile-topbar{display:flex;}
  .main{margin-left:0!important;padding-top:52px;}
  .sdb{top:52px;} /* 側欄從頂部 bar 下方開始 */
  .sidebar-overlay{top:52px;}
}
</style>
</head>
<body>
<div class="app">
<aside class="sdb">
  <div class="logo">
    <div id="sdb-logo" style="margin-bottom:8px;cursor:pointer" onclick="changeLogo()" title="點擊更換 LOGO">
      <img id="logo-img" src="" style="max-height:48px;max-width:160px;display:none;border-radius:5px;object-fit:contain">
      <div id="logo-placeholder" style="font-size:11px;color:var(--tx3);padding:4px 0">點擊上傳 LOGO</div>
    </div>
    <h1>慢樂仙坊</h1><p>進銷存管理系統</p>
    <input type="file" id="logo-file" accept="image/*" style="display:none" onchange="handleLogoUpload(this)">
  </div>
  <div class="ns">總覽</div>
  <div class="ni on" data-p="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span>總覽</span></div>
  <div class="ns">商品</div>
  <div class="ni" data-p="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg><span>商品列表</span></div>
  <div class="ni" data-p="promotions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span>活動/套組</span></div>
  <div class="ns">進貨</div>
  <div class="ni" data-p="purchase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg><span>進貨管理</span></div>
  <div class="ns">銷售</div>
  <div class="ni" data-p="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg><span>銷售訂單</span></div>
  <div class="ns">借貨</div>
  <div class="ni" data-p="loans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/></svg><span>借貨管理</span></div>
  <div class="ni" data-p="loanParties"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><line x1="19" y1="8" x2="23" y2="8"/></svg><span>借貨對象名單</span></div>
  <div class="ns">客戶</div>
  <div class="ni" data-p="customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>客戶資料</span></div>
  <div class="ns">財務</div>
  <div class="ni" data-p="accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>對帳記錄</span></div>
  <div class="ni" data-p="bonus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg><span>獎金/分潤</span></div>

// 產生當日流水號，例如 PO-20260806-003
async function genNo(prefix, table, noField){
  const td=today().replace(/-/g,'');
  const prefix_full=prefix+'-'+td+'-';
  // 查今天已有幾張
  const{data}=await sb.from(table).select(noField).like(noField, prefix_full+'%');
  const max=(data||[]).reduce((m,r)=>{
    const n=parseInt((r[noField]||'').replace(prefix_full,''));
    return isNaN(n)?m:Math.max(m,n);
  },0);
  return prefix_full+String(max+1).padStart(3,'0');
}

// Creates a searchable product picker
// id: unique id, items: [{value,label,data}], onSelect: fn(value,data)
let _ssState={};
function createSS(id,items,placeholder,selectedVal){
  const sel=items.find(x=>x.value===selectedVal);
  return `<div class="ss-wrap" id="ss-${id}">
    <input class="ss-input" id="ss-inp-${id}" placeholder="${placeholder||'搜尋…'}" value="${sel?sel.label:''}" autocomplete="off"
      oninput="ssFilter('${id}',this.value)"
      onfocus="ssOpen('${id}')"
      onblur="setTimeout(()=>ssClose('${id}'),350)">
    <input type="hidden" id="ss-val-${id}" value="${selectedVal||''}">
    <div class="ss-drop" id="ss-drop-${id}"></div>
  </div>`;
}
function ssOpen(id){
  _ssState[id]=_ssState[id]||{};
  ssFilter(id,$('ss-inp-'+id).value);
  $('ss-drop-'+id).classList.add('open');
}
function ssClose(id){$('ss-drop-'+id)?.classList.remove('open');}
function ssFilter(id,q){
  const items=_ssState[id]?.items||[];
  const filtered=q?items.filter(x=>x.label.toLowerCase().includes(q.toLowerCase())):items;
  const drop=$('ss-drop-'+id);
  if(!drop)return;
  if(!filtered.length){drop.innerHTML=`<div class="ss-opt no">無符合結果</div>`;return;}
  drop.innerHTML=filtered.slice(0,50).map(x=>`<div class="ss-opt" onmousedown="ssPick('${id}','${x.value.replace(/'/g,"\\'")}','${x.label.replace(/'/g,"\\'")}')">${x.label}</div>`).join('');
}
function ssPick(id,val,lbl){
  $('ss-val-'+id).value=val;
  $('ss-inp-'+id).value=lbl;
  ssClose(id);
  if(_ssState[id]?.onChange) _ssState[id].onChange(val);
}
function ssGet(id){return $('ss-val-'+id)?.value||'';}
function ssInit(id,items,onChange){_ssState[id]={items,onChange};}

function previewProdImg(input){
  const file=input.files[0]; if(!file)return;
  const preview=document.getElementById('prod-img-preview');
  const urlField=document.getElementById('f-pimg');
  const reader=new FileReader();
  reader.onload=e=>{
    if(preview) preview.innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover">`;
    if(urlField) urlField.value=''; // 清空 URL 欄，等儲存時再上傳
    // 儲存 file 到全域，saveProd 時上傳
    window._prodImgFile=file;
  };
  reader.readAsDataURL(file);
}

async function loadCatList(){
  const{data}=await sb.from('products').select('category').not('category','is',null);

async function saveProd(existingNo){
  const no=existingNo||v('pno'), nm=v('pname');
  if(!nm){toast('請填寫商品名稱','e');return;}
  const priceFields={price_founder:n('pf'),price_region:n('prg'),price_city:n('pct'),price_dealer:n('pdr'),price_vip:n('pvp'),price_retail:n('prl'),cost:n('pcost')};
  // 處理圖片：先上傳檔案（如果有），再存 URL
  let imageUrl = v('pimg') || document.getElementById('prod-img-url')?.value || null;
  if(window._prodImgFile){
    const file=window._prodImgFile;
    const ext=file.name.split('.').pop();
    const path=`${existingNo||v('pno')}-${Date.now()}.${ext}`;
    const{data:upData,error:upErr}=await sb.storage.from('product-images').upload(path,file,{upsert:true,contentType:file.type});
    if(upErr){ toast('圖片上傳失敗：'+upErr.message,'e'); }
    else{
      const{data:urlData}=sb.storage.from('product-images').getPublicUrl(path);
      imageUrl=urlData?.publicUrl||imageUrl;
    }
    window._prodImgFile=null;
  }
  const obj={name:nm,spec:v('pspec')||null,category:(()=>{const cv=v('pcat');return(cv&&cv!=='__new__')?cv:null;})(),unit:v('punit')||'個',stock:n('pstock')||0,...priceFields,source:v('psource')||null,vendor_product_no:v('pvpno')||null,image_url:imageUrl,description:v('pdesc')||null};
  let err;
  if(existingNo){
    // 比對舊價格，有變動則記錄
    const{data:old}=await sb.from('products').select('price_founder,price_region,price_city,price_dealer,price_vip,price_retail,cost').eq('product_no',existingNo).single();
    if(old){
      const priceNames={price_founder:'創始',price_region:'大區',price_city:'市代',price_dealer:'經銷',price_vip:'VIP',price_retail:'零售',cost:'進貨價'};
      const logs=[];
      for(const[col,label] of Object.entries(priceNames)){
        const ov=old[col],nv=priceFields[col];
        if(ov!==nv&&(ov!=null||nv!=null)) logs.push({product_no:existingNo,price_type:label,old_price:ov,new_price:nv,change_date:today(),note:'編輯更新'});
      }
      if(logs.length) await sb.from('product_price_logs').insert(logs);
    }
    ({error:err}=await sb.from('products').update(obj).eq('product_no',existingNo));
  } else {
    if(!no){toast('請填寫商品編號','e');return;}
    obj.product_no=no;
    ({error:err}=await sb.from('products').insert(obj));
  }
  if(err){toast('儲存失敗：'+err.message,'e');return;}
  toast(existingNo?'商品已更新':'商品新增成功！');CM();products();
}

function adjStk(no,name,cur){
  OM(`調整庫存：${name}`,`
    <p style="margin-bottom:13px">目前庫存：<strong class="${skCls(cur)}" style="font-size:20px">${cur}</strong></p>
    <div class="fg">
      ${fs('adjt','調整方式',['設定為','增加','減少'],'設定為')}
      ${fi('adjq','數量','number','0')}
    </div>
    <div style="margin-top:10px">${fi('adjn','備註（調整原因）')}</div>`,
  `<button class="btn" onclick="CM()">取消</button><button class="btn btn-p" onclick="doAdj('${no}',${cur})">確認</button>`);
}
async function doAdj(no,cur){
  const t=v('adjt'),q=n('adjq')||0;
  const ns=t==='設定為'?q:t==='增加'?cur+q:Math.max(0,cur-q);
  const{error}=await sb.from('products').update({stock:ns}).eq('product_no',no);
  if(error){toast('調整失敗','e');return;}
  await logAction('adjust','products',no,`庫存調整 ${no}：${cur} → ${ns}（${type==='設定為'?'設定為':type==='增加'?'+'+qty+' 增加':'-'+qty+' 減少'}）${v('adjn')?'，原因：'+v('adjn'):''}`,{stock:cur},{stock:ns});
  toast(`庫存已調整為 ${ns}`);CM();products();
}
async function toggleProd(no,active){
  const isActive = active!==false && active!=='false';
  const msg=isActive?`確定停用「${no}」？停用後不會出現在新增訂單的選單中，歷史記錄不受影響。`:`確定重新啟用「${no}」？`;
  if(!confirm(msg))return;
  await sb.from('products').update({is_active:!isActive}).eq('product_no',no);
  toast(isActive?'商品已停用':'商品已重新啟用');
  products();
}

async function dProd(no,name){
  if(!confirm(`確定刪除「${name}」？`))return;
  await sb.from('products').delete().eq('product_no',no);
  toast('商品已刪除');products();
}

window.filterItemDrop=(id,q)=>{
  const drop=$('idrop-'+id);if(!drop)return;
  const fil=q?_allProds.filter(p=>p.name.includes(q)||(p.product_no||'').includes(q)||(p.spec||'').includes(q)):_allProds;

  drop.innerHTML=fil.slice(0,30).map(p=>`<div style="padding:6px 9px;font-size:12px;cursor:pointer" onmouseover="this.style.background='var(--acl)'" onmouseout="this.style.background=''" onmousedown="pickItem(${id},'${p.product_no.replace(/'/g,"\\'")}','${p.name.replace(/'/g,"\\'")}')">
    ${p.name}${p.spec?` (${p.spec})`:''} <span style="color:var(--tx3)">庫存:${p.stock}</span>
  </div>`).join('')||'<div style="padding:6px 9px;font-size:12px;color:var(--tx3)">無結果</div>';
};
window.closeItemDrop=id=>{const d=$('idrop-'+id);if(d)d.style.display='none';};
window.pickItem=(id,pno,name)=>{
  const it=_items.find(x=>x.id===id);if(!it)return;
  it.pno=pno; it._pname=name;
  const p=_allProds.find(x=>x.product_no===pno);
  if(p){
    const lv=v('oalv')||'零售';
    const col=LEVEL_COLS[lv]||'price_retail';
    it.price=p[col]||p.price_retail||0;
  }
  it.amt=it.qty*(it.price||0);
  // 只更新搜尋框文字，不重繪（避免焦點跳掉）
  const srch=$('isrch-'+id);
  if(srch) srch.value=name;
  closeItemDrop(id);
  updAmt();
};
window.addItem=()=>{_items.push({id:Date.now(),pno:'',_pname:'',qty:1,price:0,giftQty:0,amt:0});renderItems();};
window.rmItem=id=>{_items=_items.filter(x=>x.id!==id);renderItems();};
window.setIQ=(id,val)=>{const it=_items.find(x=>x.id===id);if(it){it.qty=Math.max(1,+val||1);it.amt=it.qty*it.price;}renderItems();};
window.setIV=(id,val)=>{const it=_items.find(x=>x.id===id);if(it){it.price=+val||0;it.amt=it.qty*it.price;}renderItems();};

function updAmt(){

}

async function saveOrder(editNo){
  const no=editNo||v('ono'), nm=v('oname'), dt=v('odate');
  if(!no||!nm){toast('請填寫訂單號和客戶名稱','e');return;}
  const its=_items.filter(i=>i.pno&&((i.qty||0)+(i.giftQty||0))>0);
  if(!its.length){toast('請至少選一項商品','e');return;}
  const sub=its.reduce((s,i)=>s+i.amt,0),fee=n('ofee')||0,tax=0,total=sub+fee;
  const payload={order_date:dt,customer_name:nm,phone:v('ophone'),ship_address:v('oaddr'),payment_method:v('opay'),shipping_method:v('oshp'),shipping_fee:fee,note:v('onote'),agent_level:v('oalv'),invoice_no:v('oinv')||null,subtotal:sub,tax,total,payment_done:editNo?undefined:false,products_summary:its.map(i=>(_allProds.find(p=>p.product_no===i.pno)?.name||i.pno)).join('、')};
  if(editNo){
    await sb.from('sales_order_items').delete().eq('order_no',editNo);
    const{error}=await sb.from('sales_orders').update(payload).eq('order_no',editNo);
    if(error){toast('修改失敗：'+error.message,'e');return;}
  } else {
    payload.order_no=no;payload.payment_done=false;
    const{error}=await sb.from('sales_orders').insert(payload);
    if(error){toast('建立失敗：'+error.message,'e');return;}
  }
  const rows=its.map(i=>{
    const p=_allProds.find(x=>x.product_no===i.pno);
    return {
      order_no:no, product_no:i.pno, product_name:i._pname||p?.name||i.pno,
      unit_price:i.is_gift?0:i.price,
      qty:i.qty||0,
      gift_qty:i.giftQty||0,
      actual_qty:(i.qty||0)+(i.giftQty||0),
      amount:i.amt||0,
      year_month:ym(dt),
      promo_code:i.promo_code||null,
      bundle_group:i.bundle_group||null,
      bundle_name:i.bundle_name||null,
      is_bundle_item:!!(i.promo_code),
      is_gift:i.is_gift||false
    };
  });
  await sb.from('sales_order_items').insert(rows);
  if(!editNo){
    // 扣庫存：銷售數+贈品數 = 實際出貨量
  for(const i of its){
    const actualOut=(i.qty||0)+(i.giftQty||0);
    if(actualOut<=0) continue;
    const{data:p}=await sb.from('products').select('stock').eq('product_no',i.pno).single();
    if(p) await sb.from('products').update({stock:Math.max(0,p.stock-actualOut)}).eq('product_no',i.pno);
  }
  }
  toast(editNo?'訂單已修改！':'訂單建立成功！庫存已自動扣除');CM();orders();
}

async function editOrder(no){
  const[{data:o},{data:its},{data:pr},{data:cu}]=await Promise.all([
    sb.from('sales_orders').select('*').eq('order_no',no).single(),
    sb.from('sales_order_items').select('*').eq('order_no',no),
    sb.from('products').select('product_no,name,spec,stock,price_founder,price_region,price_city,price_dealer,price_vip,price_retail').not('product_no','is',null).eq('is_active',true).order('name'),
    sb.from('customers').select('customer_no,name,agent_level,phone,ship_full_address').order('name'),
  ]);

async function doShipment(no,its){
  no=no||window._shipNo; its=its||window._shipIts;
  const sdt=v('sdt')||today();
  let allShipped=true, anyShipped=false;
  for(const i of its){
    const shipQty=parseFloat($('f-ship-'+i.id)?.value)||0;
    if(shipQty<=0) continue;
    anyShipped=true;
    const newShipped=Math.min((i.qty||0)+(i.gift_qty||0),(i.shipped_qty||0)+shipQty);
    await sb.from('sales_order_items').update({shipped_qty:newShipped}).eq('id',i.id);
    // 再查一次確認是否全部出完
    if(newShipped<(i.qty||0)+(i.gift_qty||0)) allShipped=false;
  }
  // 重新確認所有 items
  const{data:updatedIts}=await sb.from('sales_order_items').select('qty,gift_qty,shipped_qty').eq('order_no',no);
  const allDone=(updatedIts||[]).every(i=>(i.shipped_qty||0)>=(i.qty||0)+(i.gift_qty||0));
  const partDone=(updatedIts||[]).some(i=>(i.shipped_qty||0)>0);
  const status=allDone?'全部出貨':partDone?'部分出貨':'待出貨';
  await sb.from('sales_orders').update({ship_status:status,actual_ship_date:allDone?sdt:null}).eq('order_no',no);
  toast('出貨記錄已更新！');CM();orders();
}

async function doReceipt(no,its){
  no=no||window._recvNo; its=its||window._recvIts;
  for(const i of its){
    const recvQty=parseFloat($('f-recv-'+i.id)?.value)||0;
    if(recvQty<=0) continue;
    const newRecv=Math.min((i.qty||0)+(i.gift_qty||0),(i.received_qty||0)+recvQty);
    await sb.from('purchase_order_items').update({received_qty:newRecv}).eq('id',i.id);
    // 增加庫存（已收貨部分）
    const{data:p}=await sb.from('products').select('stock').eq('product_no',i.product_no).single();
    if(p) await sb.from('products').update({stock:p.stock+recvQty}).eq('product_no',i.product_no);
  }
  const{data:updIts}=await sb.from('purchase_order_items').select('qty,gift_qty,received_qty').eq('po_no',no);
  const allDone=(updIts||[]).every(i=>(i.received_qty||0)>=(i.qty||0)+(i.gift_qty||0));
  const partDone=(updIts||[]).some(i=>(i.received_qty||0)>0);
  const status=allDone?'全部收貨':partDone?'部分收貨':'待收貨';
  await sb.from('purchase_orders').update({receipt_status:status,done:allDone}).eq('po_no',no);
  toast('收貨記錄已更新！庫存已增加');CM();purchase();
}

  _poItems.forEach(item=>{
    if(item.bundle_group && item.bundle_group!==_prevBG){
      _prevBG=item.bundle_group;
      const bname=item.bundle_name||item.promo_code||'套組';
      const bItems=_poItems.filter(x=>x.bundle_group===item.bundle_group);
      const bTotal=bItems.reduce((s,x)=>s+(x.amt||0),0);
      _html+='<div style="grid-column:1/-1;background:var(--bll);border-radius:var(--r);padding:5px 10px;font-size:12px;font-weight:600;color:var(--bl);display:flex;justify-content:space-between;margin-bottom:3px">'
        +'<span>📦 '+bname+'</span><span style="font-weight:400;font-size:11px">合計 '+fM(bTotal)+'</span></div>';
    } else if(!item.bundle_group){ _prevBG=''; }

    const borderStyle=item.bundle_group?'border-left:3px solid var(--bl);padding-left:10px':'';
    const giftLabel=(item.giftQty>0&&item.qty===0)?'<div style="grid-column:1/-1;font-size:10px;color:var(--am);font-weight:600;margin-bottom:2px">🎁 贈品（不計費）</div>':'';
    _html+='<div class="ir ir-po" style="'+borderStyle+'">'+giftLabel;

    // 商品搜尋框
    const pname=item._pname||(item.pno?(_poProds.find(p=>p.product_no===item.pno)?.name||item.pno):'');
    _html+='<div style="position:relative">'
      +'<input type="text" id="posrch-'+item.id+'" value="'+pname.replace(/"/g,'&quot;')+'" placeholder="輸入關鍵字搜尋商品…"'
      +' style="font-size:12px;padding:5px 7px;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf);width:100%;outline:none"'
      +' oninput="filterPODrop('+item.id+',this.value)" onfocus="filterPODrop('+item.id+',this.value)"'
      +' onblur="if(!window._ime)setTimeout(()=>closePODrop('+item.id+'),400)"'
      +' oncompositionstart="window._ime=true" oncompositionend="window._ime=false" autocomplete="off">'
      +'<div id="podrop-'+item.id+'" style="position:absolute;top:100%;left:0;right:0;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);max-height:160px;overflow-y:auto;z-index:500;display:none;box-shadow:0 4px 12px rgba(0,0,0,.1)"></div>'
      +'</div>';

    _html+='<input type="number" value="'+(item.qty||0)+'" min="0"'
      +' onchange="setPOIQ('+item.id+',this.value)"'
      +' style="font-size:12px;padding:5px 7px;border:1px solid var(--bd);border-radius:var(--r);width:100%;outline:none" title="進貨數量">';

    // 進貨價（贈品顯示 $0 且可編輯）
    _html+='<input type="number" value="'+(item.price||0)+'" placeholder="進貨價"'
      +' onchange="setPOIV('+item.id+',this.value)"'
      +' style="font-size:12px;padding:5px 7px;border:1px solid var(--bd);border-radius:var(--r);width:100%;outline:none'
      +(item.bundle_group?';background:var(--sf2)':'')+'">';

window.filterPODrop=(id,q)=>{const drop=$('podrop-'+id);if(!drop)return;drop.style.display='block';const fil=q?_poProds.filter(p=>p.name.includes(q)||(p.product_no||'').includes(q)):_poProds;drop.innerHTML=fil.slice(0,30).map(p=>`<div style="padding:6px 9px;font-size:12px;cursor:pointer" onmouseover="this.style.background='var(--acl)'" onmouseout="this.style.background=''" onmousedown="pickPOItem(${id},'${p.product_no.replace(/'/g,"\\'")}','${p.name.replace(/'/g,"\\'")}',${p.cost||0})">${p.name}${p.spec?` (${p.spec})`:''}</div>`).join('')||'<div style="padding:6px 9px;font-size:12px;color:var(--tx3)">無結果</div>';};
window.closePODrop=id=>{const d=$('podrop-'+id);if(d)d.style.display='none';};
window.pickPOItem=(id,pno,name,cost)=>{
  const it=_poItems.find(x=>x.id===id);if(!it)return;
  it.pno=pno; it._pname=name; it.price=cost||0; it.amt=it.qty*it.price;
  const srch=$('posrch-'+id);
  if(srch) srch.value=name;
  closePODrop(id);
  updPOAmt();
};
window.addPOItem=()=>{_poItems.push({id:Date.now(),pno:'',qty:1,price:0,amt:0});renderPOItems();};
window.rmPOItem=id=>{_poItems=_poItems.filter(x=>x.id!==id);renderPOItems();};
window.setPOIQ=(id,val)=>{const it=_poItems.find(x=>x.id===id);if(it){it.qty=Math.max(1,+val||1);it.amt=it.qty*it.price;}renderPOItems();};
window.setPOIV=(id,val)=>{const it=_poItems.find(x=>x.id===id);if(it){it.price=+val||0;it.amt=it.qty*it.price;}renderPOItems();};
window.setPOIG=(id,val)=>{const it=_poItems.find(x=>x.id===id);if(it){it.giftQty=Math.max(0,+val||0);}updPOAmt();};
function updPOAmt(){const el=$('poAmt');if(!el)return;const sub=_poItems.reduce((s,i)=>s+i.amt,0);el.innerHTML=`合計（已含稅）：<span style="color:var(--br)">${fM(sub)}</span>`;}

async function savePO(editNo){
  const no=editNo||v('pono'), vn=v('povname'), dt=v('podt');
  if(!no||!vn){toast('請填寫進貨單號和廠商名稱','e');return;}
  const its=_poItems.filter(i=>i.pno&&((i.qty||0)+(i.giftQty||0))>0);
  const sub=its.reduce((s,i)=>s+i.amt,0),tax=0,total=sub;  // 含稅價，不外加
  const payload={po_date:dt,vendor_name:vn,payment_method:v('popay'),invoice_no:v('poinv')||null,note:v('ponote'),subtotal:sub,tax,total,year_month:ym(dt),products_summary:its.map(i=>(_poProds.find(p=>p.product_no===i.pno)?.name||i.pno)).join('、')};
  if(editNo){
    await sb.from('purchase_order_items').delete().eq('po_no',editNo);
    await sb.from('purchase_orders').update(payload).eq('po_no',editNo);
  } else {
    payload.po_no=no;payload.done=false;
    const{error}=await sb.from('purchase_orders').insert(payload);
    if(error){toast('建立失敗：'+error.message,'e');return;}
  }
  if(its.length){
    await sb.from('purchase_order_items').insert(its.map(i=>{
      const p=_poProds.find(x=>x.product_no===i.pno);
      return {
        po_no:no, product_no:i.pno, product_name:p?.name||i._pname||i.pno,
        spec:p?.spec, unit_price:i.price||0,
        qty:i.qty||0,
        gift_qty:i.giftQty||0,
        amount:i.amt||0,
        po_date:dt,
        promo_code:i.promo_code||null,
        bundle_group:i.bundle_group||null
      };
    }));
    // 庫存由「收貨記錄」按鈕更新，建單時不自動增加
  }
  toast(editNo?'進貨單已修改！':'進貨單建立成功！請按「收貨記錄」確認收到貨後再更新庫存');CM();purchase();
}

async function addCust(){
  // 自動產生下一個客戶編號

  const{data:last}=await sb.from('customers').select('customer_no').like('customer_no','C-0____').order('customer_no',{ascending:false}).limit(5);
  let nextNo='C-00001';
  if(last&&last.length){

// ── LOANS ──
let _loanItems=[], _loanProds=[];
let lFilter='all';
async function loans(){
  try{
    // 用兩段 query：未歸還排前面，同類再依日期倒序
    let q=sb.from('loan_orders')
      .select('loan_no,loan_date,direction,customer_name,agent_level,products_summary,total,return_status,returned,bad_debt,bad_debt_note',{count:'exact'});
    if(lFilter==='pending') q=q.eq('returned',false).eq('bad_debt',false);
    if(lFilter==='done') q=q.eq('returned',true);
    if(lFilter==='bad') q=q.eq('bad_debt',true);
    // 先抓全部，在前端自己排序（未歸還置頂，再依日期倒序）
    const{data:raw,count}=await q.limit(200);

    // 排序：未歸還/部分歸還在前，全部歸還在後；同狀態內依日期倒序
    const statusOrder=s=>{
      if(!s||s==='未歸還') return 0;
      if(s==='部分歸還') return 1;
      return 2;
    };
    const data=(raw||[]).sort((a,b)=>{
      const sd=statusOrder(a.return_status)-statusOrder(b.return_status);
      if(sd!==0) return sd;
      return (b.loan_date||'').localeCompare(a.loan_date||'');
    });

    const pendingCount=(raw||[]).filter(l=>!l.returned&&l.return_status!=='全部歸還').length;

    $('main').innerHTML=`
    <div class="ph"><div><div class="pt">借貨管理</div><div class="ps">${count||0} 張${pendingCount>0?` · <span style="color:var(--rd);font-weight:600">${pendingCount} 筆未歸還</span>`:''}</div></div>
      <div class="ha"><button class="btn btn-p btn-s" onclick="addLoan()">＋ 新增借貨單</button></div></div>
    <div class="pc">
      <div class="tab-bar">
        <div class="tab ${lFilter==='all'?'on':''}" onclick="lFilter='all';loans()">全部</div>
        <div class="tab ${lFilter==='pending'?'on':''}" onclick="lFilter='pending';loans()" style="${lFilter!=='pending'&&pendingCount>0?'color:var(--rd)':''}">
          未歸還 ${pendingCount>0?`<span style="background:var(--rd);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;margin-left:3px">${pendingCount}</span>`:''}
        </div>
        <div class="tab ${lFilter==='done'?'on':''}" onclick="lFilter='done';loans()">已歸還</div>
        <div class="tab ${lFilter==='bad'?'on':''}" onclick="lFilter='bad';loans()" style="color:var(--tx3)">呆帳</div>
      </div>
      <div class="tc">
        <div class="tb"><span class="tt">借貨單列表</span>
          <span style="font-size:11px;color:var(--tx3)">
            <span style="display:inline-block;width:10px;height:10px;background:var(--rdl);border:1px solid var(--rd);border-radius:2px;margin-right:3px"></span>未歸還
            <span style="display:inline-block;width:10px;height:10px;background:var(--aml);border:1px solid var(--am);border-radius:2px;margin:0 3px 0 8px"></span>部分歸還
          </span>
        </div>
        <div class="tw"><table>
          <tr><th>借貨單號</th><th>日期</th><th>方向</th><th>客戶</th><th>位階</th><th>商品</th><th>歸還狀態</th><th>操作</th></tr>
          ${data.map(l=>{
            const isBadDebt=l.bad_debt===true;
            const isNotReturned=!l.returned&&l.return_status!=='全部歸還'&&!isBadDebt;
            const isPartial=l.return_status==='部分歸還'&&!isBadDebt;
            const rowBg=isBadDebt?'background:#f0f0f0;opacity:.7':isNotReturned&&!isPartial?'background:var(--rdl)':isPartial?'background:var(--aml)':'';
            return `<tr style="${rowBg}">
              <td style="font-size:11px;font-family:monospace;${isNotReturned?'font-weight:600;color:var(--rd)':'color:var(--tx2)'}">${l.loan_no}</td>
              <td style="font-size:12px;font-weight:${isNotReturned?'600':'400'}">${fD(l.loan_date)}</td>
              <td><span class="badge ${l.direction==='借出'?'bb':'bbr'}">${l.direction||'借出'}</span></td>
              <td style="font-weight:500">${l.customer_name||'—'}</td>
              <td>${lvBadge(l.agent_level)}</td>
              <td style="font-size:12px;color:var(--tx2);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l.products_summary||'—'}</td>
              <td>
                ${l.bad_debt?'<span class="badge bgr">呆帳核銷</span>':''}
                <span class="badge ${l.return_status==='全部歸還'||l.returned?'bg':l.return_status==='部分歸還'?'ba':'br2'}">${l.return_status||'未歸還'}</span>
              </td>
              <td><div style="display:flex;gap:3px">
                <button class="btn btn-s" onclick="showLoan('${l.loan_no}')">明細</button>
                ${isBadDebt
                  ? `<button class="btn btn-s" onclick="toggleBadDebt('${l.loan_no}',true)">取消呆帳</button>`
                  : `${isNotReturned||isPartial?`<button class="btn btn-s btn-p" onclick="returnLoan('${l.loan_no}')">記錄歸還</button>`:`<button class="btn btn-s" onclick="returnLoan('${l.loan_no}')">歸還記錄</button>`}
                    <button class="btn btn-s" style="color:var(--tx3);border-color:var(--tx3)" onclick="markBadDebt('${l.loan_no}')">呆帳</button>`
                }
              </div></td>
            </tr>`;
          }).join('')}
        </table></div>
      </div>
    </div>`;
  }catch(e){$('main').innerHTML=`<div class="ld" style="color:var(--rd)">載入失敗：${e.message}</div>`;}
}

window.filterLoanDrop=(id,q)=>{const drop=$('ldrop-'+id);if(!drop)return;drop.style.display='block';const fil=q?_loanProds.filter(p=>p.name.includes(q)||(p.product_no||'').includes(q)):_loanProds;drop.innerHTML=fil.slice(0,30).map(p=>`<div style="padding:6px 9px;font-size:12px;cursor:pointer" onmouseover="this.style.background='var(--acl)'" onmouseout="this.style.background=''" onmousedown="pickLoanItem(${id},'${p.product_no.replace(/'/g,"\\'")}','${p.name.replace(/'/g,"\\'")}')">
  ${p.name}${p.spec?` (${p.spec})`:''} <span style="color:var(--tx3)">庫存:${p.stock}</span></div>`).join('')||'<div style="padding:6px 9px;font-size:12px;color:var(--tx3)">無結果</div>';};
window.closeLoanDrop=id=>{const d=$('ldrop-'+id);if(d)d.style.display='none';};
window.pickLoanItem=(id,pno,name)=>{const it=_loanItems.find(x=>x.id===id);if(it){it.pno=pno;}renderLoanItems();const inp=document.querySelector(`#ldrop-${id}`)?.previousElementSibling;if(inp)inp.value=name;closeLoanDrop(id);};
window.addLoanItem=()=>{_loanItems.push({id:Date.now(),pno:'',qty:1});renderLoanItems();};
window.rmLoanItem=id=>{_loanItems=_loanItems.filter(x=>x.id!==id);renderLoanItems();};
window.setLoanIQ=(id,val)=>{const it=_loanItems.find(x=>x.id===id);if(it)it.qty=Math.max(1,+val||1);};

async function saveLoan(){
  const no=v('lno'),nm=v('lname'),dt=v('ldt'),dir=v('ldir');
  if(!no||!nm){toast('請填寫單號和客戶名稱','e');return;}
  const its=_loanItems.filter(i=>i.pno&&i.qty>0);
  if(!its.length){toast('請至少選一項商品','e');return;}
  await sb.from('loan_orders').insert({loan_no:no,loan_date:dt,direction:dir,customer_name:nm,phone:v('lph'),agent_level:v('llv'),address:v('laddr'),shipping_method:v('lshp'),note:v('lnote'),return_status:'未歸還',returned:false,products_summary:its.map(i=>(_loanProds.find(p=>p.product_no===i.pno)?.name||i.pno)).join('、'),year_month:ym(dt)});
  await sb.from('loan_order_items').insert(its.map(i=>{const p=_loanProds.find(x=>x.product_no===i.pno);return{loan_no:no,product_no:i.pno,product_name:p?.name||i.pno,spec:p?.spec,qty:i.qty,returned_qty:0};}));
  // 連動庫存
  for(const i of its){
    const{data:p}=await sb.from('products').select('stock').eq('product_no',i.pno).single();
    if(p){const ns=dir==='借出'?Math.max(0,p.stock-i.qty):p.stock+i.qty;await sb.from('products').update({stock:ns}).eq('product_no',i.pno);}
  }
  toast('借貨單建立成功！庫存已更新');CM();loans();
}

async function doReturn(no,its){
  const rdt=v('rdt')||today();
  let allReturned=true, anyReturned=false;
  for(const i of its){
    const retQty=parseFloat($('f-ret-'+i.id)?.value)||0;
    const newRet=Math.min(i.qty,(i.returned_qty||0)+retQty);
    if(newRet<i.qty) allReturned=false;
    if(retQty>0){
      anyReturned=true;
      await sb.from('loan_order_items').update({returned_qty:newRet,return_date:rdt}).eq('id',i.id);
      // 連動庫存（歸還則補回庫存）
      const{data:p}=await sb.from('products').select('stock').eq('product_no',i.product_no).single();
      if(p) await sb.from('products').update({stock:p.stock+retQty}).eq('product_no',i.product_no);
    }
  }
  const status=allReturned?'全部歸還':anyReturned?'部分歸還':'未歸還';
  await sb.from('loan_orders').update({return_status:status,returned:allReturned,return_date:allReturned?rdt:null}).eq('loan_no',no);
  toast('歸還記錄已更新！庫存已連動');CM();loans();
}

async function accounts(){
  const[{data:yr},{data:orders_m},{data:po_m},{data:bn_m}]=await Promise.all([
    sb.from('yearly_accounts').select('*').order('year',{ascending:false}),
    sb.from('sales_orders').select('year_month,total,payment_done,order_no,order_date,customer_name'),
    sb.from('purchase_orders').select('year_month,total,po_no,po_date,vendor_name,done'),
    sb.from('bonus_records').select('year_month,amount,payment_done,direction,record_no,record_date,recipient,type'),
  ]);

  // 統一 year_month 格式：全部轉成 YYYY-MM（去斜線、補零）
  const normYM=ym=>{
    if(!ym||ym.trim()==='') return '（未知月）';
    let s=ym.trim().replace(/\//g,'-');        // 2026/05 → 2026-05
    s=s.replace(/^(\d{4})-(\d)$/,'$1-0$2');   // 2026-5 → 2026-05
    return s;
  };

  // 按月彙整
  const byMonth={};
  const addM=(k,field,val)=>{byMonth[k]=byMonth[k]||{in:0,po:0,bn_out:0,bn_in:0,orders:[],pos:[],bns:[]};byMonth[k][field]+=val;};

  (orders_m||[]).forEach(o=>{
    const k=normYM(o.year_month);
    byMonth[k]=byMonth[k]||{in:0,po:0,bn_out:0,bn_in:0,orders:[],pos:[],bns:[]};
    if(o.payment_done) byMonth[k].in+=Number(o.total||0);
    byMonth[k].orders.push(o);
  });
  (po_m||[]).forEach(p=>{
    const k=normYM(p.year_month);
    byMonth[k]=byMonth[k]||{in:0,po:0,bn_out:0,bn_in:0,orders:[],pos:[],bns:[]};
    byMonth[k].po+=Number(p.total||0);
    byMonth[k].pos.push(p);
  });
  (bn_m||[]).forEach(b=>{
    const k=normYM(b.year_month);
    byMonth[k]=byMonth[k]||{in:0,po:0,bn_out:0,bn_in:0,orders:[],pos:[],bns:[]};
    if(b.direction==='收入') byMonth[k].bn_in+=Number(b.amount||0);
    else byMonth[k].bn_out+=Number(b.amount||0);
    byMonth[k].bns.push(b);
  });

  // 排序（未知月放最後）
  const monthKeys=Object.keys(byMonth).sort((a,b)=>{
    if(a==='（未知月）') return 1; if(b==='（未知月）') return -1;
    return b.localeCompare(a);
  });

  // 把細節資料存全域供點擊查看
  window._acctByMonth=byMonth;

  $('main').innerHTML=`
  <div class="ph"><div><div class="pt">對帳記錄</div><div class="ps">依訂單自動彙整</div></div></div>
  <div class="pc">
    ${(yr&&yr.length)?`<div class="tc" style="margin-bottom:14px"><div class="tb"><span class="tt">年度對帳</span></div>
    <div class="tw"><table><tr><th>年份</th><th>收入</th><th>支出</th><th>結餘</th></tr>
    ${(yr||[]).map(y=>`<tr><td style="font-weight:600">${y.year}</td><td class="num ok">${fM(y.income)}</td><td class="num cr">${fM(y.expense)}</td><td class="num" style="font-weight:700;color:${y.total>=0?'var(--ac)':'var(--rd)'}">${fM(y.total)}</td></tr>`).join('')}
    </table></div></div>`:''}
    <div class="tc"><div class="tb"><span class="tt">月度彙整（依訂單計算，點月份看細節）</span></div>
    <div class="tw"><table>
      <tr><th>月份</th><th>銷售收入<br><small>已收款</small></th><th>獎金收入</th><th>進貨支出</th><th>獎金支出</th><th style="font-weight:700">淨利</th></tr>
      ${monthKeys.map(k=>{
        const d=byMonth[k];
        const net=d.in+d.bn_in-d.po-d.bn_out;
        return `<tr style="cursor:pointer" onclick="showMonthDetail('${k}')" onmouseover="this.style.background='var(--acl)'" onmouseout="this.style.background=''">
          <td style="font-weight:600;color:var(--ac)">${k}</td>
          <td class="num ok">${d.in?fM(d.in):'—'}</td>
          <td class="num ok" style="color:var(--br)">${d.bn_in?fM(d.bn_in):'—'}</td>
          <td class="num cr">${d.po?fM(d.po):'—'}</td>
          <td class="num cr" style="color:var(--am)">${d.bn_out?fM(d.bn_out):'—'}</td>
          <td class="num" style="font-weight:700;color:${net>=0?'var(--ac)':'var(--rd)'}">${fM(net)}</td>
        </tr>`;
      }).join('')}
    </table></div></div>
  </div>`;
}

        <div><div style="font-size:11px;color:var(--tx3)">規格</div><div style="font-size:14px">${p?.spec||'—'}</div></div>
        <div><div style="font-size:11px;color:var(--tx3)">類別</div><div><span class="badge bgr" style="font-size:12px">${p?.category||'—'}</span></div></div>
        <div><div style="font-size:11px;color:var(--tx3)">主要來源</div><div style="font-size:14px">${p?.source||'—'}</div></div>
        <div><div style="font-size:11px;color:var(--tx3)">廠商原始編號</div><div style="font-size:13px;font-family:monospace">${p?.vendor_product_no||'—'}</div></div>
        <div><div style="font-size:11px;color:var(--tx3)">單位</div><div style="font-size:14px">${p?.unit||'個'}</div></div>
      </div>
      <div style="background:var(--acl);border-radius:8px;padding:12px;display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:11px;color:var(--tx3)">目前庫存</div>
          <div class="${skCls(p?.stock||0)}" style="font-size:28px;font-weight:700;line-height:1.2">${fN(p?.stock)}</div>
        </div>
        <button class="btn btn-s" onclick="adjStk('${no}','${(p?.name||'').replace(/'/g,"\'")}',${p?.stock||0})">調庫存</button>
      </div>
    </div>

    <!-- 各位階售價 -->
    <div style="background:var(--sf);border-radius:12px;padding:14px;margin-bottom:12px">
      <div style="font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:.5px;margin-bottom:10px;text-transform:uppercase">各位階售價</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${priceRows.map(([lbl, val]) => {
          const isCost = lbl==='進貨';
          const isRetail = lbl==='零售';
          const bg = isCost ? '#fff3e0' : isRetail ? '#f3e5f5' : 'var(--acl)';
          const clr = isCost ? '#e65100' : isRetail ? '#7b1fa2' : 'var(--ac)';
          const border = isCost ? '1.5px solid #ff9800' : isRetail ? '1px solid #ce93d8' : '1px solid transparent';
          return `<div style="background:${bg};border-radius:8px;padding:10px 12px;border:${border}">
            <div style="font-size:11px;color:var(--tx3);margin-bottom:2px">${lbl}${isCost?' 💰':''}</div>
            <div style="font-size:18px;font-weight:700;color:${clr}">${fM(val)}</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- 記錄 -->
    <div style="background:var(--sf);border-radius:12px;padding:14px;margin-bottom:12px">
      <div style="display:flex;border-bottom:1px solid var(--bd);margin-bottom:12px">
        <div class="tab on" id="mptab-s" onclick="switchMPTab('s')" style="flex:1;text-align:center;font-size:13px;padding:8px 4px">銷貨</div>
        <div class="tab" id="mptab-p" onclick="switchMPTab('p')" style="flex:1;text-align:center;font-size:13px;padding:8px 4px">進貨</div>
        <div class="tab" id="mptab-l" onclick="switchMPTab('l')" style="flex:1;text-align:center;font-size:13px;padding:8px 4px">借貨</div>
        <div class="tab" id="mptab-a" onclick="switchMPTab('a')" style="flex:1;text-align:center;font-size:13px;padding:8px 4px">調整</div>
      </div>
      <div id="mptab-s-con">
        ${(its||[]).length===0?'<div style="text-align:center;color:var(--tx3);padding:16px;font-size:13px">暫無銷貨紀錄</div>':
          (its||[]).map(i=>{const o=soMap[i.order_no];return '<div style="padding:10px 0;border-bottom:1px solid var(--bd)">'
            +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
            +'<a href="#" onclick="event.preventDefault();showOrder(this.dataset.no)" data-no="'+i.order_no+'" style="color:var(--ac);font-weight:600;font-size:14px">'+i.order_no+'</a>'
            +'<span class="badge '+(o?.payment_done?'bg':'br2')+'" style="font-size:12px">'+(o?.payment_done?'已收':'未收')+'</span></div>'
            +'<div style="display:flex;justify-content:space-between;align-items:center">'
            +'<span style="font-size:13px;color:var(--tx2)">'+(o?.customer_name||'—')+' · '+fD(o?.order_date)+'</span>'
            +'<span style="font-size:16px;font-weight:700">'+fM(i.amount)+'</span></div>'
            +'<div style="font-size:12px;color:var(--tx3);margin-top:2px">售價 '+fM(i.unit_price)+' × '+fN(i.qty)+(i.gift_qty?' + 贈 '+fN(i.gift_qty):'')+'</div>'
            +'</div>';}).join('')}
      </div>
      <div id="mptab-p-con" style="display:none">
        ${(poIts||[]).length===0?'<div style="text-align:center;color:var(--tx3);padding:16px;font-size:13px">暫無進貨紀錄</div>':
          (poIts||[]).map(i=>{const o=poMap[i.po_no];return '<div style="padding:10px 0;border-bottom:1px solid var(--bd)">'
            +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
            +'<a href="#" onclick="event.preventDefault();showPO(this.dataset.no)" data-no="'+i.po_no+'" style="color:var(--br);font-weight:600;font-size:14px">'+i.po_no+'</a>'
            +'<span class="badge '+(o?.receipt_status==='全部收貨'?'bg':o?.receipt_status==='部分收貨'?'ba':'br2')+'" style="font-size:12px">'+(o?.receipt_status||'待收貨')+'</span></div>'
            +'<div style="display:flex;justify-content:space-between;align-items:center">'
            +'<span style="font-size:13px;color:var(--tx2)">'+(o?.vendor_name||'—')+' · '+fD(o?.po_date)+'</span>'
            +'<span style="font-size:16px;font-weight:700">'+fM(i.amount)+'</span></div>'
            +'<div style="font-size:12px;color:var(--tx3);margin-top:2px">進 '+(fN((i.qty||0)+(i.gift_qty||0)))+' 件 · 已收 '+fN(i.received_qty||0)+'</div>'
            +'</div>';}).join('')}
      </div>
      <div id="mptab-l-con" style="display:none">
        ${(loanIts||[]).length===0?'<div style="text-align:center;color:var(--tx3);padding:16px;font-size:13px">暫無借貨紀錄</div>':
          (loanIts||[]).map(i=>{const o=lnMap[i.loan_no];return '<div style="padding:10px 0;border-bottom:1px solid var(--bd)">'
            +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
            +'<a href="#" onclick="event.preventDefault();showLoan(this.dataset.no)" data-no="'+i.loan_no+'" style="color:var(--bl);font-weight:600;font-size:14px">'+i.loan_no+'</a>'
            +'<span class="badge '+(o?.direction==='借出'?'bb':'bbr')+'" style="font-size:12px">'+(o?.direction||'借出')+'</span></div>'
            +'<div style="display:flex;justify-content:space-between;align-items:center">'
            +'<span style="font-size:13px;color:var(--tx2)">'+(o?.customer_name||'—')+' · '+fD(o?.loan_date)+'</span>'
            +'<span class="badge '+(o?.return_status==='全部歸還'?'bg':'br2')+'" style="font-size:12px">'+(o?.return_status||'未歸還')+'</span></div>'
            +'<div style="font-size:12px;color:var(--tx3);margin-top:2px">借 '+fN(i.qty)+' 件 · 已還 '+fN(i.returned_qty||0)+'</div>'
            +'</div>';}).join('')}
      </div>
      <div id="mptab-a-con" style="display:none">
        ${(adjLogs||[]).length===0?'<div style="text-align:center;color:var(--tx3);padding:16px;font-size:13px">暫無調整記錄</div>':
          (adjLogs||[]).map(l=>'<div style="padding:10px 0;border-bottom:1px solid var(--bd)"><div style="font-size:12px;color:var(--tx3)">'+new Date(l.created_at).toLocaleString('zh-TW')+' · '+(l.operator||'—')+'</div><div style="font-size:13px;margin-top:3px">'+(l.description||'—')+'</div></div>').join('')}
      </div>
    </div>

    <!-- 底部按鈕 -->
    <div style="display:flex;gap:10px;padding-bottom:24px">
      <button class="btn" style="flex:1;padding:12px;font-size:15px" onclick="adjStk('${no}','${(p?.name||'').replace(/'/g,"\'")}',${p?.stock||0})">調庫存</button>
      <button class="btn btn-p" style="flex:1;padding:12px;font-size:15px" onclick="editProdByNo('${no}')">編輯商品</button>
    </div>
  </div>`;

  window.switchMPTab = tab => {
    ['s','p','l','a'].forEach(t => {
      const btn = document.getElementById('mptab-'+t);
      const con = document.getElementById('mptab-'+t+'-con');
      if(btn) btn.className = 'tab' + (t===tab?' on':'');
      if(con) con.style.display = t===tab ? 'block' : 'none';
    });
  };
  document.querySelectorAll('.ni').forEach(el => el.classList.remove('on'));
  document.querySelector('.ni[data-p="products"]')?.classList.add('on');
}
window.showProdPage = showProdPage;
</script>
</body>
</html><script>
// ════════════════════════════════════════
//  套組/活動系統 (Promotions Module)
// ════════════════════════════════════════

// ── 套組管理頁面 ──
async function promotions() {
  const { data, count } = await sb.from('promotions').select('*', { count: 'exact' }).order('is_active', { ascending: false }).order('end_date', { ascending: true });
  const today_s = today();
  const fmt_date = d => d ? d : '—';
  const typeColor = { '固定套組': 'bb', '買幾送幾': 'bg', '折扣金額': 'ba', '百分比折扣': 'bbr' };

  $('main').innerHTML = `
  <div class="ph"><div><div class="pt">活動/套組管理</div><div class="ps">${count || 0} 個</div></div>
    <div class="ha"><button class="btn btn-p btn-s" onclick="addPromo()">＋ 新增活動/套組</button></div></div>
  <div class="pc">
    <div class="al al-w" style="font-size:12px">
      <b>設計說明：</b>建立套組後，在新增訂單/進貨/借貨時點「加入套組」，系統自動展開所有商品品項（含贈品），不需逐一手動輸入。
      套組有時效性，過期後無法選用。
    </div>
    <div class="tc">
      <div class="tb"><span class="tt">活動/套組列表</span></div>
      <div class="tw"><table>
        <tr><th>代碼</th><th>名稱</th><th>類型</th><th>有效期間</th><th>套組內容</th><th>狀態</th><th>操作</th></tr>
        ${(data || []).map(p => {
          const expired = p.end_date && p.end_date < today_s;
          const active = p.is_active && !expired;
          return `<tr>
            <td style="font-size:11px;font-family:monospace;color:var(--tx2)">${p.promo_code}</td>
            <td style="font-weight:500">${p.name}</td>
            <td><span class="badge ${typeColor[p.type] || 'bgr'}">${p.type}</span></td>
            <td style="font-size:12px">${fmt_date(p.start_date)} ～ ${fmt_date(p.end_date)}</td>
            <td style="font-size:12px;color:var(--tx2)">${p.description || '—'}</td>
            <td><span class="badge ${active ? 'bg' : 'br2'}">${expired ? '已過期' : p.is_active ? '使用中' : '停用'}</span></td>
            <td><div style="display:flex;gap:3px">
              <button class="btn btn-s" onclick="showPromo('${p.promo_code}')">查看</button>
              <button class="btn btn-s" onclick="editPromo('${p.promo_code}')">編輯</button>
              <button class="btn btn-s" onclick="togglePromo('${p.promo_code}',${p.is_active})">
                ${p.is_active ? '停用' : '啟用'}
              </button>
            </div></td>
          </tr>`;
        }).join('')}
      </table></div>
    </div>
  </div>`;
}

// ── 新增/編輯套組 ──
let _promoItems = [], _allProdsForPromo = [];

async function addPromo() {
  const { data: prods } = await sb.from('products').select('product_no,name,spec,stock').eq('is_active',true).order('name');
  _allProdsForPromo = prods || [];
  _promoItems = [];
  const td = today();
  const code = 'PRO-' + td.replace(/-/g, '').slice(2) + '-' + String(Date.now()).slice(-3);
  OM('新增活動/套組', promoForm({ promo_code: code }), promoFoot(false), true);
  renderPromoItems();
}

async function editPromo(code) {
  const [{ data: p }, { data: its }, { data: prods }] = await Promise.all([
    sb.from('promotions').select('*').eq('promo_code', code).single(),
    sb.from('promotion_items').select('*').eq('promo_code', code).order('id'),
    sb.from('products').select('product_no,name,spec,stock').order('name'),
  ]);
  _allProdsForPromo = prods || [];
  _promoItems = (its || []).map((i, idx) => ({ id: idx + 1, pno: i.product_no, name: i.product_name, qty: i.qty, is_gift: i.is_gift, price_override: i.price_override }));
  OM('編輯活動/套組', promoForm(p), promoFoot(code), true);
  renderPromoItems();
}

function promoFoot(editCode) {
  return `<button class="btn" onclick="CM()">取消</button><button class="btn btn-p" onclick="savePromo(${editCode ? "'" + editCode + "'" : 'false'})">儲存</button>`;
}

function promoForm(p) {
  p = p || {};
  return `<div class="fg" style="margin-bottom:12px">
    <div class="fl"><label>代碼</label><input id="f-pcode" value="${p.promo_code || ''}" ${p.promo_code && !p.promo_code.startsWith('PRO-') ? 'disabled style="opacity:.6"' : ''}></div>
    <div class="fl"><label>名稱 *</label><input id="f-pname" value="${p.name || ''}"></div>
    <div class="fl"><label>類型</label>
      <select id="f-ptype" onchange="updatePromoFields()">
        ${['固定套組', '買幾送幾', '折扣金額', '百分比折扣'].map(t => `<option ${t === p.type ? 'selected' : ''}>${t}</option>`).join('')}
      </select></div>
    <div class="fl"><label>生效日期</label><input id="f-pstart" type="date" value="${p.start_date || ''}"></div>
    <div class="fl"><label>到期日（空白=永久）</label><input id="f-pend" type="date" value="${p.end_date || ''}"></div>
    <div class="fl fw" id="promo-extra-fields">
      ${promoExtraFields(p)}
    </div>
    <div class="fl fw"><label>說明（顯示在訂單上）</label><input id="f-pdesc" value="${p.description || ''}"></div>
    <div class="fl fw"><label>備註</label><input id="f-pnote" value="${p.note || ''}"></div>
  </div>
  <div class="sh">套組/活動商品</div>
  <div style="display:grid;grid-template-columns:3fr 60px 80px 60px 28px;gap:6px;padding:4px 8px;font-size:10px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px">
    <span>商品</span><span>數量</span><span>套組價</span><span style="color:var(--am)">贈品</span><span></span>
  </div>
  <div id="promoItemsArea"></div>
  <button class="btn btn-s" onclick="addPromoItem()" style="margin-top:6px">＋ 加商品</button>`;
}

function promoExtraFields(p) {
  const type = p.type || '固定套組';
  if (type === '固定套組') return `<label>套組售價（空白=各商品加總）</label><input id="f-pbprice" type="number" value="${p.bundle_price || ''}">`;
  if (type === '買幾送幾') return `<div style="display:flex;gap:8px;align-items:center"><div style="flex:1"><label>購買數量</label><input id="f-pbuy" type="number" value="${p.buy_qty || ''}"></div><div style="flex:1"><label>贈送數量</label><input id="f-pget" type="number" value="${p.get_qty || ''}"></div></div>`;
  if (type === '折扣金額') return `<label>折扣金額（NT$）</label><input id="f-pdamt" type="number" value="${p.discount_amount || ''}">`;
  if (type === '百分比折扣') return `<label>折扣百分比（0-100）</label><input id="f-pdpct" type="number" min="0" max="100" value="${p.discount_pct || ''}">`;
  return '';
}

window.updatePromoFields = () => {
  const t = $('f-ptype')?.value || '固定套組';
  const ef = $('promo-extra-fields');
  if (ef) ef.innerHTML = promoExtraFields({ type: t });
};

function renderPromoItems() {
  const area = $('promoItemsArea'); if (!area) return;
  area.innerHTML = _promoItems.map(item => `
  <div style="display:grid;grid-template-columns:3fr 60px 80px 60px 28px;gap:6px;align-items:center;background:var(--sf2);border-radius:var(--r);padding:7px;margin-bottom:5px">
    <div style="position:relative">
      <input type="text" value="${item.pno ? (item.name || item.pno) : ''}" placeholder="輸入關鍵字搜尋商品…"
        style="font-size:12px;padding:5px 7px;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf);width:100%;outline:none"
        oninput="filterPromoDrop(${item.id},this.value)" onfocus="filterPromoDrop(${item.id},this.value)"
        onblur="setTimeout(()=>closePromoDrop(${item.id}),350)">
      <div id="prodrop-${item.id}" style="position:absolute;top:100%;left:0;right:0;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);max-height:140px;overflow-y:auto;z-index:500;display:none;box-shadow:0 4px 12px rgba(0,0,0,.1)"></div>
    </div>
    <input type="number" value="${item.qty || 1}" min="1" onchange="setPromoIQ(${item.id},this.value)"
      style="font-size:12px;padding:5px 7px;border:1px solid var(--bd);border-radius:var(--r);width:100%;outline:none">
    <input type="number" value="${item.price_override || ''}" placeholder="套組價" onchange="setPromoIV(${item.id},this.value)"
      style="font-size:12px;padding:5px 7px;border:1px solid var(--bd);border-radius:var(--r);width:100%;outline:none">
    <input type="checkbox" ${item.is_gift ? 'checked' : ''} onchange="setPromoIG(${item.id},this.checked)"
      style="width:16px;height:16px;cursor:pointer" title="勾選=贈品（免費）">
    <button onclick="rmPromoItem(${item.id})" style="background:none;border:none;cursor:pointer;color:var(--rd);font-size:18px;line-height:1">×</button>
  </div>`).join('');
}

window.filterPromoDrop = (id, q) => {
  const drop = $('prodrop-' + id); if (!drop) return;
  const fil = q ? _allProdsForPromo.filter(p => p.name.includes(q) || (p.product_no || '').includes(q)) : _allProdsForPromo;
  drop.style.display = 'block';
  drop.innerHTML = fil.slice(0, 30).map(p =>
    `<div style="padding:6px 9px;font-size:12px;cursor:pointer" onmouseover="this.style.background='var(--acl)'" onmouseout="this.style.background=''"
      onmousedown="pickPromoItem(${id},'${p.product_no.replace(/'/g,"\\'")}','${p.name.replace(/'/g,"\\'")}')">
      ${p.name}${p.spec ? ` (${p.spec})` : ''} <span style="color:var(--tx3)">庫存:${p.stock}</span>
    </div>`).join('') || '<div style="padding:6px 9px;font-size:12px;color:var(--tx3)">無結果</div>';
};
window.closePromoDrop = id => { const d = $('prodrop-' + id); if (d) d.style.display = 'none'; };
window.pickPromoItem = (id, pno, name) => {
  const it = _promoItems.find(x => x.id === id); if (!it) return;
  it.pno = pno; it.name = name;
  renderPromoItems();
  closePromoDrop(id);
};
window.addPromoItem = () => { _promoItems.push({ id: Date.now(), pno: '', name: '', qty: 1, is_gift: false, price_override: null }); renderPromoItems(); };
window.rmPromoItem = id => { _promoItems = _promoItems.filter(x => x.id !== id); renderPromoItems(); };
window.setPromoIQ = (id, val) => { const it = _promoItems.find(x => x.id === id); if (it) it.qty = Math.max(1, +val || 1); };
window.setPromoIV = (id, val) => { const it = _promoItems.find(x => x.id === id); if (it) it.price_override = +val || null; };
window.setPromoIG = (id, checked) => { const it = _promoItems.find(x => x.id === id); if (it) it.is_gift = checked; };

async function savePromo(editCode) {
  const code = v('pcode'), name = v('pname'), type = v('ptype');
  if (!code || !name) { toast('請填寫代碼和名稱', 'e'); return; }
  const payload = {
    promo_code: code, name, type,
    start_date: v('pstart') || null, end_date: v('pend') || null,
    description: v('pdesc') || null, note: v('pnote') || null,
    bundle_price: null, discount_amount: null, discount_pct: null, buy_qty: null, get_qty: null,
  };
  if (type === '固定套組') payload.bundle_price = parseFloat($('f-pbprice')?.value) || null;
  if (type === '買幾送幾') { payload.buy_qty = parseFloat($('f-pbuy')?.value) || null; payload.get_qty = parseFloat($('f-pget')?.value) || null; }
  if (type === '折扣金額') payload.discount_amount = parseFloat($('f-pdamt')?.value) || null;
  if (type === '百分比折扣') payload.discount_pct = parseFloat($('f-pdpct')?.value) || null;

  if (editCode) {
    await sb.from('promotions').update(payload).eq('promo_code', editCode);
    await sb.from('promotion_items').delete().eq('promo_code', editCode);
  } else {
    payload.is_active = true;
    const { error } = await sb.from('promotions').insert(payload);
    if (error) { toast('新增失敗：' + error.message, 'e'); return; }

async function openBundlePicker(mode) {
  // mode: 'order' | 'po' | 'loan'
  const today_s = today();

        <button class="btn btn-p btn-s" onclick="applyPromo('${p.promo_code}','${mode}',parseInt(document.getElementById('bqty-${p.promo_code}')?.value)||1)">
          加入 →
        </button>
      </div>

async function applyPromo(code, mode, sets) {
  sets = Math.max(1, parseInt(sets) || 1);
  const [{ data: p }, { data: its }] = await Promise.all([
    sb.from('promotions').select('*').eq('promo_code', code).single(),
    sb.from('promotion_items').select('*').eq('promo_code', code).order('is_gift'),
  ]);
  if (!its || !its.length) { toast('此套組尚無商品設定', 'w'); return; }

  const today_s = today();
  if (p.end_date && p.end_date < today_s) { toast('此套組已過有效期！', 'e'); return; }

  const bundleGroup = 'BG-' + Date.now();

  if (mode === 'order') {
    // 取得客戶位階決定售價
    const lv = $('f-oalv')?.value || '零售';
    const col = LEVEL_COLS[lv] || 'price_retail';

    for (const i of its) {
      const { data: prod } = await sb.from('products').select('product_no,name,spec,stock,' + col).eq('product_no', i.product_no).single();
      const unitPrice = i.is_gift ? 0 : (i.price_override || prod?.[col] || 0);
      const itemQty = (i.qty || 1) * sets;       // 數量 × 組數
      const newItem = {
        id: Date.now() + Math.random(),
        pno: i.product_no,
        qty: i.is_gift ? 0 : itemQty,
        price: unitPrice,
        giftQty: i.is_gift ? itemQty : 0,
        amt: i.is_gift ? 0 : (itemQty * unitPrice),
        is_gift: i.is_gift,
        promo_code: code,
        bundle_name: p.name + (sets > 1 ? ' ×' + sets : ''),
        bundle_group: bundleGroup,
        _pname: i.product_name || prod?.name || i.product_no,
      };
      _items.push(newItem);
    }
    // 套組折扣
    if (p.discount_amount) {
      _items.push({ id: Date.now(), pno: 'DISCOUNT', qty: 1, price: -p.discount_amount, giftQty: 0, amt: -p.discount_amount, _pname: `套組折扣 (${p.name})`, promo_code: code, bundle_group: bundleGroup });
    }
    CM2();
    renderItems();
    toast('套組已展開，請確認品項！');
  } else if (mode === 'po') {
    for (const i of its) {
      const pQty = (i.qty || 1) * sets;
      // 從已載入的商品清單取進貨成本，若套組有設定 price_override 則優先使用
      const prodInfo = _poProds.find(x => x.product_no === i.product_no);
      const price = i.is_gift ? 0 : (i.price_override || prodInfo?.cost || 0);
      _poItems.push({ id: Date.now() + Math.random(), pno: i.product_no, qty: i.is_gift ? 0 : pQty, price, giftQty: i.is_gift ? pQty : 0, amt: i.is_gift ? 0 : pQty * price, _pname: i.product_name || prodInfo?.name || i.product_no, promo_code: code, bundle_name: p.name + (sets > 1 ? ' ×' + sets : ''), bundle_group: bundleGroup });
    }
    CM2();
    renderPOItems();
    toast('套組已展開至進貨品項！');
  } else if (mode === 'loan') {
    for (const i of its) {
      const lQty = (i.qty || 1) * sets;
      _loanItems.push({ id: Date.now() + Math.random(), pno: i.product_no, qty: lQty, _pname: i.product_name || i.product_no, promo_code: code, bundle_group: bundleGroup, is_gift: i.is_gift });
    }
    CM2();
    renderLoanItems();
    toast('套組已展開至借貨品項！');
  }
}

async function doPrintStockTake() {

  const selCats = [...document.querySelectorAll('.cat-cb:checked')].map(c=>c.value);
  const hideZero = document.getElementById('hide-zero')?.checked;
  CM();

  // 載入商品（套用篩選）
  let q = sb.from('products')
    .select('product_no,name,spec,category,unit,stock,source')
    .not('product_no','is',null);
  // 來源篩選
  if(selSrcs.length > 0) q = q.in('source', selSrcs);
  // 類別篩選
  if(selCats.length > 0) q = q.in('category', selCats);
  if(hideZero) q = q.gt('stock', 0);

  const { data: prods } = await q.order('category').order('product_no');

  if (!prods || !prods.length) { toast('無商品資料', 'w'); return; }

  const today_str = new Date().toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit' });
  const today_iso = today();

  // 依類別分組
  const groups = {};
  prods.forEach(p => {
    const cat = p.category || '其他';

    groups[cat].push(p);
  });

  const totalItems = prods.length;
  const totalStock = prods.reduce((s, p) => s + (p.stock || 0), 0);
  const lowStock = prods.filter(p => p.stock <= 5 && p.stock > 0).length;
  const zeroStock = prods.filter(p => p.stock <= 0).length;

    tableRows += `<tr class="cat-header"><td colspan="8">${cat}</td></tr>`;
    items.forEach(p => {
      rowNum++;
      const stockClass = p.stock <= 0 ? 'zero' : p.stock <= 5 ? 'low' : '';

      <tr class="${stockClass}">
        <td class="center">${rowNum}</td>
        <td class="mono">${p.product_no}</td>
        <td>${p.name}${p.spec ? `<span class="spec"> ${p.spec}</span>` : ''}</td>

        <td class="right actual-stock"></td>
        <td class="right diff"></td>
        <td class="note-col"></td>

.summary-box .label { font-size: 10px; color: #777; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
.summary-box .val { font-size: 18px; font-weight: 700; }
.val.red { color: #c0392b; } .val.amber { color: #b8860b; } .val.green { color: #2d6a2d; }

    </div>

  <div id="split-src-info" style="font-size:12px;color:var(--tx2);margin-bottom:10px;padding:5px 8px;background:var(--sf2);border-radius:var(--r)">

  </div>
  <div class="sh">拆出品項</div>
  <div style="display:grid;grid-template-columns:3fr 80px 28px;gap:6px;padding:3px 6px;font-size:10px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">
    <span>商品</span><span>數量</span><span></span>

    <div class="fl"><label>備註</label>
      <input id="split-note" placeholder="例：愛閃耀福袋 2026/05 批次"

    </div>
  </div>`,
  `<button class="btn" onclick="CM()">取消</button><button class="btn btn-p" onclick="doSplitBag()">確認拆袋（更新庫存）</button>`);

  window.filterSplitSrc = q => {
    const drop = $('split-src-drop'); if(!drop) return;
    const fil = q ? _splitProds.filter(p=>p.name.includes(q)||(p.product_no||'').includes(q)) : _splitProds;
    drop.style.display = 'block';
    drop.innerHTML = fil.slice(0,30).map(p=>

  renderSplitItems();
}

function renderSplitItems() {
  const area = $('splitItemsArea'); if(!area) return;
  area.innerHTML = _splitItems.map(item => `
  <div style="display:grid;grid-template-columns:3fr 80px 28px;gap:6px;align-items:center;background:var(--sf2);border-radius:var(--r);padding:7px;margin-bottom:5px">

      <input type="text" value="${item.name||''}" placeholder="輸入關鍵字搜尋商品…"
        style="font-size:12px;padding:5px 7px;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf);width:100%;outline:none"

    </div>
    <input type="number" value="${item.qty||1}" min="1" onchange="setSplitIQ(${item.id},this.value)"
      style="font-size:12px;padding:5px 7px;border:1px solid var(--bd);border-radius:var(--r);width:100%;outline:none">
    <button onclick="rmSplitItem(${item.id})" style="background:none;border:none;cursor:pointer;color:var(--rd);font-size:18px;line-height:1">×</button>
  </div>`).join('');
}

window.filterSplitDrop = (id, q) => {
  const drop = $('sdrop-'+id); if(!drop) return;
  const fil = q ? _splitProds.filter(p=>p.name.includes(q)||(p.product_no||'').includes(q)) : _splitProds;
  drop.style.display = 'block';
  drop.innerHTML = fil.slice(0,30).map(p=>
    `<div style="padding:6px 9px;font-size:12px;cursor:pointer"
      onmouseover="this.style.background='var(--acl)'" onmouseout="this.style.background=''"
      onmousedown="pickSplitItem(${id},'${p.product_no.replace(/'/g,"\\'")}','${p.name.replace(/'/g,"\\'")}')">
      ${p.name}${p.spec?` (${p.spec})`:''} <span style="color:var(--tx3)">庫存:${p.stock}</span>
    </div>`
  ).join('') || '<div style="padding:6px 9px;font-size:12px;color:var(--tx3)">無結果</div>';
};
window.closeSplitDrop = id => { const d=$('sdrop-'+id); if(d) d.style.display='none'; };
window.pickSplitItem = (id, pno, name) => {
  const it = _splitItems.find(x=>x.id===id); if(!it) return;
  it.pno = pno; it.name = name;
  renderSplitItems();
  closeSplitDrop(id);
};
window.addSplitItem = () => { _splitItems.push({id:Date.now(),pno:'',name:'',qty:1}); renderSplitItems(); };
window.rmSplitItem = id => { _splitItems=_splitItems.filter(x=>x.id!==id); renderSplitItems(); };
window.setSplitIQ = (id, val) => { const it=_splitItems.find(x=>x.id===id); if(it) it.qty=Math.max(1,+val||1); };

async function doSplitBag() {
  const srcPno = $('split-src-pno')?.value;
  const srcQty = parseInt($('split-src-qty')?.value) || 1;
  const note = $('split-note')?.value || '拆袋作業';
  const outItems = _splitItems.filter(i=>i.pno && i.qty>0);

  if(!srcPno) { toast('請選擇來源商品（要拆解的）', 'e'); return; }
  if(!outItems.length) { toast('請至少新增一項拆出品項', 'e'); return; }

  // 確認來源庫存夠
  const {data:src} = await sb.from('products').select('name,stock').eq('product_no',srcPno).single();
  if(!src) { toast('找不到來源商品', 'e'); return; }
  if(src.stock < srcQty) {
    if(!confirm(`來源商品「${src.name}」庫存僅剩 ${src.stock}，確定要拆 ${srcQty} 個？`)) return;
  }

  // 扣除來源
  const newSrcStock = Math.max(0, src.stock - srcQty);
  await sb.from('products').update({stock: newSrcStock}).eq('product_no', srcPno);

  // 增加各拆出品項
  for(const item of outItems) {
    const {data:p} = await sb.from('products').select('stock').eq('product_no',item.pno).single();
    if(p) await sb.from('products').update({stock: p.stock + item.qty}).eq('product_no',item.pno);
  }

  // 記錄在庫存調整（用 products 備註或直接用 toast 告知）
  toast(`✅ 拆袋完成！「${src.name}」庫存 ${src.stock} → ${newSrcStock}，已增加 ${outItems.length} 項拆出品項`);
  CM();
  products(); // 刷新商品頁
}

window.openSplitBag = openSplitBag;
window.doSplitBag = doSplitBag;
</script>

<script>
// ════════════════════════════
//  LOGO 管理（存在 localStorage）
// ════════════════════════════
function changeLogo(){
  document.getElementById('logo-file')?.click();
}
function handleLogoUpload(input){
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    const src=e.target.result;
    applyLogo(src);
    // 同步存到 Supabase（所有裝置都能用）
    try{
      await sb.from('settings').upsert({key:'logo',value:src,updated_at:new Date().toISOString()});
      toast('LOGO 已儲存並同步到所有裝置');
    }catch(err){
      // fallback: 只存 localStorage
      localStorage.setItem('mls_logo', src);
      toast('LOGO 已儲存（僅此裝置）','w');
    }
  };
  reader.readAsDataURL(file);
}
function applyLogo(src){
  if(!src) return;
  console.log('[Logo] applyLogo called, src length:', src?.length);
  // 側欄 logo
  const img=document.getElementById('logo-img');
  const ph=document.getElementById('logo-placeholder');
  if(img){ img.src=src; img.style.display='block'; if(ph) ph.style.display='none'; }
  // 手機頂部 logo
  const mImg=document.getElementById('mobile-logo-img');
  const mTxt=document.getElementById('mobile-logo-text');
  if(mImg){ mImg.src=src; mImg.style.display='block'; if(mTxt) mTxt.style.display='none'; }
}
// 從 Supabase 載入 LOGO（跨裝置同步）
async function initLogo(){
  try{
    const{data}=await sb.from('settings').select('value').eq('key','logo').single();
    if(data?.value) applyLogo(data.value);
  }catch(e){
    // fallback: localStorage
    const saved=localStorage.getItem('mls_logo');
    if(saved) applyLogo(saved);
  }
}
// initLogo 由 boot 在 sb 初始化後呼叫

window.changeLogo=changeLogo;
window.handleLogoUpload=handleLogoUpload;
window.previewProdImg=previewProdImg;
</script>
